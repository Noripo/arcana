<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METHOD ／ 経営者・行動仕様書アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBE8; --panel:#fff; --ink:#161A18; --muted:#6B7570; --line:#CDD3CF; --deep:#141A17;
  --accent:#8A8F8B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
 font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 font-size:16.5px;line-height:1.9;padding-bottom:90px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.mono{font-family:"JetBrains Mono",monospace}
a{color:inherit}

/* header */
.top{background:var(--deep);color:#E4E8E5;padding:22px 0 20px}
.brand{font-family:"Shippori Mincho B1",serif;font-size:26px;letter-spacing:.16em;font-weight:700}
.brand span{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.28em;color:#8C978F;margin-bottom:5px}
.tagline{font-size:14px;color:#A9B4AD;margin-top:9px;line-height:1.8}
.counter{display:flex;gap:14px;margin-top:14px;align-items:center}
.bar{flex:1;height:4px;background:#2B3430;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#D8E0DA}
.counter .n{font-family:"JetBrains Mono",monospace;font-size:11px;color:#A9B4AD;white-space:nowrap}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(233,235,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:2px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav button{background:none;border:none;border-bottom:2px solid transparent;padding:13px 14px 11px;
 font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.14em;color:var(--muted);cursor:pointer;white-space:nowrap}
.nav button.on{color:var(--ink);border-bottom-color:var(--ink)}

section.view{padding-top:26px}
.hd{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:16px}
.hd .tag{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--muted);white-space:nowrap}
.hd h2{font-family:"Shippori Mincho B1",serif;font-size:22px;font-weight:700;letter-spacing:.04em}
.lead{color:var(--muted);font-size:14.5px;margin-bottom:18px;line-height:1.85}

/* matrix */
.mapscroll{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);width:auto;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:0 18px 6px;scrollbar-width:thin}
.mapinner{min-width:820px;max-width:1320px;margin:0 auto}
@media(min-width:820px){.mapscroll{padding:0 24px 6px}.mapinner{min-width:0;width:100%}}
.matrix{position:relative;background:var(--panel);border:1px solid var(--line);aspect-ratio:16/10;max-height:760px;margin:0 auto 6px}
.maphint{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:16px}
@media(min-width:820px){.maphint{display:none}}
.matrix .axis{position:absolute;background:var(--line)}
.matrix .ax-v{left:50%;top:0;bottom:0;width:1px}
.matrix .ax-h{top:50%;left:0;right:0;height:1px}
.matrix .albl{position:absolute;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.12em;color:var(--muted)}
.al-t{top:7px;left:50%;transform:translateX(-50%)}
.al-b{bottom:7px;left:50%;transform:translateX(-50%)}
.al-l{left:7px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center}
.al-r{right:7px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center}
.dot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;width:0}
.dot b{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto;background:var(--ink)}
.dot span{position:absolute;left:50%;top:9px;transform:translateX(-50%);font-size:11px;line-height:1.25;color:var(--ink);white-space:nowrap;
 text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;pointer-events:none}
.dot.up span{top:auto;bottom:9px}
.dot.hidelabel span{display:none}
.dot.hidelabel:hover span,.dot.hidelabel:focus span{display:block;background:var(--panel);border:1px solid var(--line);padding:1px 4px;z-index:5}
.dot.stub{opacity:.34}
.dot.stub b{background:#fff;border:1.5px solid var(--muted)}
.dot:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;padding:5px 10px;
 background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;padding:12px 13px;border:1px solid var(--line);background:var(--panel);font-family:inherit;font-size:16px;margin-bottom:12px;-webkit-appearance:none;border-radius:0}
.search:focus{outline:2px solid var(--ink);outline-offset:-1px}

/* list */
.row{display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink);
 padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.row.stub{border-left-color:var(--line);opacity:.72}
.row .l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row .nm{font-size:17.5px;font-weight:700}
.row .yrs{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.row .l2{font-size:13px;color:var(--muted)}
.row .th{font-size:14.5px;margin-top:6px}
.badge{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;border:1px solid var(--line);padding:1px 5px;color:var(--muted);margin-left:6px}

/* detail */
.dt-head{background:var(--deep);color:#E4E8E5;padding:24px 0 22px;margin:0 -18px 22px;padding-left:18px;padding-right:18px}
.dt-head .ru{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.28em;color:#8C978F}
.dt-head h1{font-family:"Shippori Mincho B1",serif;font-size:clamp(26px,7vw,38px);font-weight:700;margin:8px 0 3px}
.dt-head .role{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;color:#A9B4AD}
.dt-head .thesis{border-left:3px solid var(--accent);padding-left:14px;margin-top:16px;font-size:16px;color:#C4CCC7;line-height:1.85}
.dt-head .thesis b{color:#fff;font-weight:500}
.back{background:none;border:none;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;color:#8C978F;cursor:pointer;padding:0 0 4px}
.spec{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px}
.spec div{background:var(--panel);padding:10px 12px}
.spec dt{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.spec dd{font-size:15px;font-weight:500;margin-top:2px}
.tl{border-left:1px solid var(--line);margin-left:6px}
.tl li{list-style:none;position:relative;padding:0 0 15px 20px}
.tl li::before{content:"";position:absolute;left:-4.5px;top:9px;width:8px;height:8px;background:var(--bg);border:1.5px solid var(--muted);border-radius:50%}
.tl li.pv::before{background:var(--accent);border-color:var(--accent)}
.tl .yr{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--muted);margin-right:8px}
.tl .pv .yr{color:var(--accent);font-weight:700}
.tl p{font-size:14px;color:var(--muted);line-height:1.8}
.rule{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--deep);padding:17px 19px;margin-bottom:13px}
.rule h3{font-size:17.5px;font-weight:700;margin-bottom:8px;line-height:1.55}
.rule .src{font-size:14px;color:var(--muted);padding-bottom:9px;margin-bottom:9px;border-bottom:1px dashed var(--line);line-height:1.85}
.rule .use{font-size:15px;line-height:1.85}
.rule .use::before{content:"自分の現場に置き換えると";display:block;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;color:var(--accent);margin-bottom:2px}
.rack{background:var(--deep);padding:15px;color:#DCE3DE}
.gauge{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.gauge .num{font-family:"JetBrains Mono",monospace;font-size:40px;line-height:1;font-weight:700;color:#fff}
.gauge .num small{font-size:16px;color:#8C978F}
.gauge .lbl{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;color:#8C978F;text-align:right;line-height:1.7}
.unit{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #29332E;cursor:pointer;-webkit-tap-highlight-color:transparent}
.unit:last-of-type{border-bottom:1px solid #29332E}
.led{flex:none;width:9px;height:9px;margin-top:7px;border-radius:1px;background:#38433D;box-shadow:inset 0 0 0 1px #4B5852;transition:background .18s}
.unit.on .led{background:var(--accent);box-shadow:0 0 7px currentColor}
.tile{flex:none;width:24px;height:32px;margin-top:1px;border-radius:3px;background:#1E2823;border:1px solid #38433D;
 font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:#5E6B64;display:flex;align-items:center;justify-content:center;transition:all .18s}
.unit.push .tile{background:#F0C24B;border-color:#F0C24B;color:#1A2620}
.unit.pull .tile{background:#5FA8D3;border-color:#5FA8D3;color:#0B2B3B}
.unit .txt{font-size:14.5px;line-height:1.7}
.unit.on .txt,.unit.push .txt,.unit.pull .txt{color:#fff}
.unit .txt small{display:block;color:#8C978F;font-size:12.5px;line-height:1.65}
.unit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reset{margin-top:11px;background:none;border:1px solid #4B5852;color:#8C978F;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;padding:5px 11px;cursor:pointer}
.fail{background:var(--panel);border:1px solid var(--line);padding:15px}
.fail ol{margin-left:1.1em;font-size:15px;line-height:1.85}
.fail li{margin-bottom:8px;padding-left:3px}
.fail li b{display:block}
.fail li span{font-size:13.5px;color:var(--muted);line-height:1.8}
.q{background:var(--panel);border:1px solid var(--line);padding:13px 15px;margin-bottom:9px}
.q .when{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.12em;color:var(--accent);margin-bottom:5px}
.q p{font-family:"Shippori Mincho B1",serif;font-size:17.5px;line-height:1.75}
.notes{font-size:13px;color:var(--muted);line-height:1.9}
.notes ul{margin-left:1.1em}
.disclaimer{border:1px solid var(--line);border-top:3px solid var(--accent);background:var(--panel);padding:15px 17px;font-size:13.5px;color:var(--muted);line-height:1.9;margin-bottom:16px}

/* cross-search / starred / laws */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{font-size:12px;padding:6px 11px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-family:inherit;color:var(--ink)}
.chips button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hit{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink);padding:12px 14px;margin-bottom:9px;cursor:pointer}
.hit .who{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.hit .who b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;letter-spacing:0;color:var(--ink)}
.hit .ttl{font-size:16px;font-weight:700;margin:6px 0 5px;line-height:1.55}
.hit .bdy{font-size:13.5px;color:var(--muted);line-height:1.8}
.hit mark{background:#FFE9A8;color:inherit;padding:0 1px}
.cnt{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);margin-bottom:10px}
.law{background:var(--panel);border:1px solid var(--line);padding:15px 16px;margin-bottom:12px}
.law .no{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.law h3{font-family:"Shippori Mincho B1",serif;font-size:19.5px;font-weight:700;margin:4px 0 7px;line-height:1.5}
.law p{font-size:15px;line-height:1.9}
.law .ev{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:5px}
.law .ev button{font-size:11.5px;padding:3px 9px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font-family:inherit;color:var(--ink)}
.law .ev button:hover{background:var(--ink);color:#fff}
.law .use{margin-top:11px;font-size:14.5px;background:var(--bg);padding:9px 11px;border-left:3px solid var(--accent)}
.law .use::before{content:"あなたの場合";display:block;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
/* core: 王道 */
.sec2{font-family:"Shippori Mincho B1",serif;font-size:19px;font-weight:700;margin:26px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.sec2 span{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.14em;color:var(--muted);display:block;font-weight:400;margin-bottom:3px}
.inv{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink);padding:14px 15px;margin-bottom:10px}
.inv h4{font-size:17.5px;font-weight:700;line-height:1.55;margin-bottom:7px}
.inv .const{font-size:13px;color:var(--muted);background:var(--bg);padding:7px 10px;margin-bottom:7px}
.inv .const::before{content:"変わらない理由（人間と組織の定数）";display:block;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;margin-bottom:2px}
.inv .how{font-size:15px;line-height:1.9}
.era{background:var(--panel);border:1px solid var(--line);border-left:3px solid #B9A46A;padding:13px 15px;margin-bottom:10px}
.era h4{font-size:16.5px;font-weight:700;margin-bottom:6px}
.era .t2{display:grid;grid-template-columns:1fr;gap:7px;font-size:13.5px;line-height:1.8}
.era .t2 div{background:var(--bg);padding:7px 10px}
.era .t2 b{display:block;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.vtype{background:var(--panel);border:1px solid var(--line);padding:14px 15px;margin-bottom:10px}
.vtype .lbl{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.14em;color:var(--accent)}
.vtype h4{font-size:17.5px;font-weight:700;margin:4px 0 6px}
.vtype .desc{font-size:14.5px;color:var(--muted);line-height:1.85;margin-bottom:9px}
.vtype .first{font-size:15px;background:var(--bg);padding:9px 11px;border-left:3px solid var(--ink);line-height:1.75}
.vtype .first::before{content:"最初の一手";display:block;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
.qshift{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.qshift .before{font-size:14px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.qshift .arrow{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);margin:3px 0}
.qshift .after{font-family:"Shippori Mincho B1",serif;font-size:17.5px;line-height:1.7}
.qshift .src2{font-size:11px;color:var(--muted);margin-top:6px}
/* base & stuck */
.base{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink);padding:14px 15px;margin-bottom:11px}
.base h4{font-size:17.5px;font-weight:700;margin-bottom:7px;line-height:1.55}
.base .prin{font-size:15px;line-height:1.9;margin-bottom:9px}
.base .ex{font-size:13.5px;color:var(--muted);line-height:1.85;background:var(--bg);padding:9px 11px}
.base .ex::before{content:"収録者の実際";display:block;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;margin-bottom:2px}
.warnbox{border:1px solid var(--line);border-top:3px solid #C9762F;background:var(--panel);padding:15px 17px;font-size:14px;color:var(--muted);line-height:1.9;margin-bottom:18px}
.step{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:12px}
.step .q{font-family:"Shippori Mincho B1",serif;font-size:17px;line-height:1.6;margin-bottom:12px}
.step .opts{display:flex;flex-direction:column;gap:7px}
.step .opts button{text-align:left;font-family:inherit;font-size:14px;padding:11px 13px;background:var(--bg);border:1px solid var(--line);cursor:pointer;color:var(--ink);line-height:1.5}
.step .opts button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.result{background:var(--deep);color:#E4E8E5;padding:16px;margin-bottom:12px}
.result .lbl{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.16em;color:#8C978F}
.result h3{font-family:"Shippori Mincho B1",serif;font-size:19px;margin:5px 0 8px;line-height:1.5}
.result p{font-size:13.5px;color:#C4CCC7;line-height:1.8}
.restart{margin-top:14px;background:none;border:1px solid var(--line);color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;padding:7px 13px;cursor:pointer}
/* design */
.pillar{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink);padding:13px 15px;margin-bottom:10px}
.pillar h4{font-size:17px;font-weight:700;margin-bottom:6px}
.pillar .freq{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:#fff;background:var(--ink);display:inline-block;padding:2px 7px;margin-bottom:6px}
.pillar .freq.w{background:#8C7B4A}
.pillar p{font-size:14.5px;line-height:1.85;color:var(--muted)}
.pillar p b{color:var(--ink)}
.tt{border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
.tt .row2{display:grid;grid-template-columns:74px 1fr;border-top:1px solid var(--line)}
.tt .row2:first-child{border-top:none}
.tt .row2.core{background:#F5F2E8}
.tt .tm{font-family:"JetBrains Mono",monospace;font-size:12.5px;padding:12px 9px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.tt .ct{padding:12px 14px;font-size:15px;line-height:1.65}
.tt .ct small{display:block;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:2px}
.wk{display:grid;grid-template-columns:44px 1fr;border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
.wk>div{padding:11px 13px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.7}
.wk>div:nth-child(1),.wk>div:nth-child(2){border-top:none}
.wk .d{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);border-right:1px solid var(--line);text-align:center}
.wk .rest{background:#F5F2E8}
/* record */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.stats div{background:var(--panel);padding:11px 13px}
.stats dt{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.12em;color:var(--muted)}
.stats dd{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;margin-top:2px}
.stats dd small{font-size:12px;color:var(--muted);font-weight:400}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.heat i{aspect-ratio:1/1;background:#E3E6E2;border-radius:2px;position:relative;font-style:normal;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:8.5px;color:rgba(0,0,0,.35)}
.heat i.f0{background:#E3E6E2}.heat i.f1{background:#CFE3D4}.heat i.f2{background:#9FCBAA}.heat i.f3{background:#66AC7C}.heat i.f4{background:#2E7D52;color:rgba(255,255,255,.75)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}

 rules:[

 rules:[
  {h:"迷ったらやる。時間は有限資源として扱う",s:"信条は迷ったらやること。失敗しても、なぜ失敗したかを振り返って次に活かす。この構えの根底に、震災で得た「人生は一回限り」という認識がある。",u:"検討中の案件に、判断期限を日付で入れる。期限が来たらやる方に倒す。迷いのコストのほうが失敗のコストより高い局面は多い。"},

  {h:"コーチをやめてプレイヤーになる",s:"経営コンサルタントはコーチであってプレイヤーではない、という区別が起業の出発点。助言者の立場にいる限り、経営そのものは分からないという認識。",u:"分析資料を作る時間と、自分が現場で動く時間の比率を見る。前者が多い月は、コーチ側に戻っている。"},

  {y:"2006〜",t:"100人いれば100通りへ",p:1,b:"退職理由が家庭・労働時間・キャリア・ライフスタイルと一人ひとり違うことに気づき、画一的なルールを捨てる。働く時間と場所を選べる制度、自由な副業、長期の育児休暇。離職率は数分の1に下がり、その後に売上も伸び始めた。"},

  {y:"2018",t:"当事者として国を訴える",p:1,b:"結婚時に妻の姓を選び、旧姓を通称で使い続けてきた当事者として、選択的夫婦別姓を求め提訴。一審・二審とも退けられたが、経営者が実名で社会制度そのものに問いを立て続けた事例として残る。"},
  {y:"2024",t:"働きやすさと働きがいの両立で国内1位",b:"日経の「プラチナ企業」ランキングで首位。20年かけた実験の外部評価。"}],
 rules:[
  {h:"制度の前に「全員が同じ」という前提を疑う",s:"退職理由を集めたら一人ひとり違った。ならば画一的なルールでは対応できない——ここから100人いれば100通りという方針が生まれている。原因ではなく前提を疑うのがこの人の型。",u:"多国籍・多世代のチームで、離職や不満の共通項を探すのをやめる。全員違う前提で、選べる幅のほうを設計する。"},
  {h:"説明責任だけでなく「質問責任」を課す",s:"おかしいと思ったなら質問する責任がある、と定義した造語。人事制度の会議には全社員が参加でき、あとで愚痴をこぼすのは認めない。議事録は全社公開し、却下した提案は理由も明かす。",u:"会議の冒頭で「ここで言わなかったことは後で言えない」と宣言する。日本人スタッフにも外国人材にも同じルールを配る。"},
  {h:"事実と解釈を分けてから話す",s:"解釈は人によって違って当たり前なので喧嘩する必要はなく、落ち着いて相手が持っている事実を確認する、という手順を社内研修のフレームワークにまで落としている。",u:"トラブル報告を「事実」と「担当者の解釈」の2欄に分けて書かせる。監理現場の食い違いはほぼここで消える。"},
  {h:"公明正大に振る舞う。隠さないことを制度にする",s:"多様性を許容するほど、情報の非対称は不信に直結する。だから情報公開と説明を先に固め、そのうえで自由度を上げるという順番を取っている。",u:"自由な働き方を導入する前に、情報公開のルールを先に敷く。順番を逆にすると不信だけが増える。"},
  {h:"採用は能力より「理想への共感」で決める",s:"チームワークあふれる社会を創るという理想があり、そこへの共感を採用の第一条件に置く。多様な個性を重視するからこそ、共通の理想だけは揃える必要がある。",u:"スキル要件の前に、理念に共感できるかを判定する質問を1つ置く。多様性を掲げる組織ほど、軸を1本だけ厳しくする。"},
  {h:"自分が最初に使う。ダメなら戻すと宣言して始める",s:"3児の父として育休を3回取り、結婚時には自ら妻の姓を選び、制度そのものを問う裁判まで起こしている。制度も採用もまずやってみて、ダメだったら戻せばいいという構え。",u:"新制度は自分が最初のユーザーになる。撤回条件を先に公表しておけば、失敗しても信用は減らない。"}],

  {b:"制度ではなく前提を疑う",s:"直すべきは規則の細部ではなく、全員が同じ働き方をするという設計思想のほう。"},

{
 id:"kumagai", name:"熊谷 正寿", roma:"KUMAGAI MASATOSHI",
 ctype:"創業", born:1963,
 role:"GMOインターネットグループ 代表取締役グループ代表", company:"GMOインターネットグループ",
 since:1991, sector:"ネットインフラ／金融／AI", gen:"第0世代", accent:"#0B3E8C", x:86, y:50, status:"filled",
 essay:"三度の巨額損失を出しながらグループを拡大し続けた。<b>私財の売却、消費者金融事業で約400億円、マイニング撤退</b>——それでも本業のインフラ事業は手放していない。攻めの資金と生存の基盤を分けているからだ。\nそして2026年、自分の判断基準をAIに学習させて社内に配備し、代表自らCAIOを兼務している。80歳を超えて、経営の属人化をAIで解こうとしている。あなたがARCANAでやろうとしていることの先例。",
 thesis:"夢を紙に書いて何度も読み返す。全員の合意は待たず9割で決める。そして三度の巨額損失を出しても本体は死なせない。",
 spec:[["BORN","1963 / 長野県東御市"],["EDUCATION","高校中退"],["FOUNDED","1991 ボイスメディア"],["IPO","1999 独立系ネット企業として国内初の店頭公開"],["LOSSES","三度の巨額損失を経験"],["NOW","グループ110社超・2026年からCAIO兼務"]],
 pivots:[
  {y:"少年期",t:"父の会社と、パチンコ台の釘の管理",b:"経営者だった父の事業を手伝い、パチンコ台の管理を経営者としての原点だと語る。高校は中退している。"},
  {y:"1985〜",t:"手帳に夢を書き始める",p:1,b:"夢や目標をかなえる力は何回想起できるかに比例する、しかし人間の脳は忘れるようにできている——だから紙に書いて繰り返し読む。この習慣がすべての土台になっている。"},
  {y:"1991",t:"父の会社を辞めて独立、ボイスメディアを設立",p:1,b:"自分で立てた夢と現実の乖離が大きくなり、実現するには全部自分でやるしかないという結論に達した、と説明している。"},
  {y:"1995〜99",t:"インターネット事業へ参入、独立系ネット企業として国内初の店頭公開"},
  {y:"2000〜",t:"ITバブル崩壊、資金繰り危機で全私財を売却",p:1,b:"最初の巨額の谷。ここで本体を守り切ったことが後の拡大の前提になる。"},
  {y:"2006〜08",t:"消費者金融事業で約400億円の損失",p:1,b:"2年間で400億円規模を失い、倒産の危機に陥る。総額400億円を投じた会社は最終的にごく僅かな金額で売却されたと記録されている。ネットのインフラという本業から離れた領域での失敗だった。"},
  {y:"2018",t:"暗号資産マイニング事業から撤退、巨額の特別損失",p:1,b:"三度目の大きな負け。それでもグループは拡大を続けている。"},
  {y:"2024〜26",t:"AIへの全面シフト、代表自らCAIOを兼務",p:1,b:"生成AIによる大規模な業務時間削減を進め、自分の経営哲学と過去の発言を学習させた「AI熊谷正寿」を社内に配備。2026年7月からはグループAI変革最高責任者を兼務している。経営の属人化をAIで防ぐという発想。"}],
 rules:[
  {h:"夢は紙に書いて、繰り返し読み返す",s:"夢をかなえる力は想起回数に比例するが、脳は忘れるようにできている。だから手帳に書いて何度も読む。IT企業の代表でありながら手書きを重視し続けている。",u:"中期経営計画をファイルに保存して終わりにしない。紙に書いて毎朝読む場所に置く。想起回数が実行確率を決める。"},
  {h:"純度90で決める",s:"正解のない時代に関係者全員の100%同意は得られない。9割が賛成すれば進める、という文化を定着させている。グループ会社トップの人選も同じ基準。",u:"6人チームで全員が納得するまで待たない。5人が賛成したら動かす、と先に宣言しておく。"},
  {h:"情報はガラス張りにする",s:"給与の公開まで踏み込み、直後は大混乱したものの、結果として自身のストレスがなくなったと述べている。隠す経営と出す経営のどちらも成立した時代は終わったという立場。",u:"開示は最初に荒れる。荒れる前提で日程を組み、荒れたあとに残る信頼を取りにいく。"},
  {h:"リーダーは目立たず、イズムを配る",s:"名声よりもイズム。経営戦略の基礎となる主義を社員一人ひとりに浸透させることを重視し、100年単位で役に立つグループを目指すとしている。",u:"あなたが前に出るより、縁道という判断基準が現場で使われている状態のほうが強い。"},
  {h:"大きく負けても、本業の足場は手放さない",s:"私財の売却、約400億円の損失、マイニング撤退——三度の巨額損失を出しながら、ドメインやサーバーというインフラ事業の足場は失っていない。攻めの資金と生存の基盤を分けている。",u:"新規事業に張るときは、監理という本業のキャッシュフローに手をつけない範囲を先に決める。"},
  {h:"自分の判断基準を、自分の外に出す",s:"経営哲学・独自のノウハウ・過去の発言をAIに学習させ、社員が使える形にした。経営の属人化を防ぐ手段としてAIを位置づけている点が、この世代の経営者としては異例。",u:"あなたの判断基準こそARCANAに載せるべき資産。過去の判断とその理由をログに残せば、同じことができる。"}],

{

 role:"オイシックス・ラ・大地 代表取締役社長", company:"オイシックス・ラ・大地",
 since:2000, sector:"食品EC／サブスク", gen:"第1世代", accent:"#8A6A3B", x:48, y:64, status:"filled",
 essay:"⭐️のつかない項目だが、この人の「状況は選べないが、課題に取り組む姿勢は選べる」は最も汎用性が高い。制度変更も人手不足も選べない。選べるのは、来る前に準備するか、来てから慌てるかだけだ。\nもうひとつ、<b>ほとんどのVCに断られた局面で1社が出してくれた</b>という記憶を持ち続けていること。苦しいときの支援者を、条件ではなく出してくれた事実で評価する。この姿勢が20年以上の関係を作っている。",
 thesis:"好きなことより得意なことを選ぶ。状況は選べないが、課題への姿勢は選べる。",
 spec:[["BORN","1973 / 神奈川県"],["EDUCATION","東大大学院 情報工学"],["BEFORE","マッキンゼー"],["FOUNDED","2000年6月・ITバブル崩壊直後"],["RESCUE","ほとんどのVCに断られ、1社が出資"],["MERGERS","2017 大地を守る会／2018 らでぃっしゅぼーや"]],
 pivots:[
  {y:"大学院期",t:"学生ベンチャーでECの面白さを知る",b:"Eコマース黎明期に自分で立ち上げ、インターネットを使ったビジネスの手応えを得ている。"},
  {y:"〜2000",t:"起業に必要なスキルを埋めるためにマッキンゼーへ",p:1,b:"最初から独立を前提に、足りない能力を意図的に取りに行っている。就職を目的ではなく手段として扱った。"},
  {y:"2000",t:"ITバブル崩壊直後に創業、資金調達が絶望的だった",p:1,b:"ほとんどのベンチャーキャピタルから出資を断られる中、シダックスグループが応じてくれた。あのタイミングで出資がなければ始まる前に終わっていた、と本人が述べている。"},
  {y:"2011",t:"震災後、東の食の会を立ち上げる",p:1,b:"被災した東日本の食品産業の長期的支援を目的に発起人・代表理事に。事業の外に公共の役割を持つようになる。"},
  {y:"2017〜18",t:"競合だった2社と経営統合",p:1,b:"大地を守る会、らでぃっしゅぼーやと相次いで統合。同じ市場で戦っていた相手を敵ではなく統合先として扱った、業界では珍しい一手。"},
  {y:"現在",t:"移動スーパーや車いすラグビー連盟の理事長も兼務",b:"買い物弱者向けの事業やスポーツ団体の運営まで領域を広げている。"}],
 rules:[
  {h:"好きなことより、得意なことを選ぶ",s:"生存戦略として明確に打ち出している考え方。情熱の対象と、自分が他人より上手くできることは別で、事業に選ぶのは後者だという立場。",u:"やりたい事業と、あなたの組織が実際に強い領域を2列に書き出す。重ならないなら、得意なほうから始めて後から寄せる。"},
  {h:"課題に取り組む姿勢は選べる",s:"起こる出来事は選べないが、それにどう向き合うかは自分で決められる、という一貫した構え。創業直後の資金難から統合の難局まで、この姿勢で通している。",u:"制度変更も人手不足も選べない。選べるのは、来る前に準備するか、来てから慌てるかだけ。"},
  {h:"必要な能力は、就職先で取りに行く",s:"起業を決めたうえで、足りないスキルを磨く場所としてコンサルティングファームを選んでいる。キャリアを目的ではなく調達手段として設計した。",u:"人材採用も同じ発想でいい。足りない能力を定義してから、それを持つ場所から採る。"},
  {h:"資金の谷では、条件より「いま出す1社」",s:"ほとんどのVCに断られた局面で、条件を吟味する余裕はなかった。出資してくれた1社があったから存在している、と繰り返し語っている。",u:"苦しい時期の支援者は、条件の良し悪しではなく、出してくれた事実で評価する。関係はそこから長く続く。"},
  {h:"競合を、統合の相手として見る",s:"同じ市場の有力2社と経営統合し、規模と顧客基盤をまとめた。潰し合いではなく足し算を選べるかどうか。",u:"監理団体の再編が進む局面では、同業を競合としか見ない組織から消えていく。統合の相手として見る目を持つ。"},
  {h:"事業の外に、公共の役割を持つ",s:"震災復興の団体、食の社会貢献運動、スポーツ団体の理事長。本業と別の場所で責任を負うことが、結果的に本業の視野と人脈を広げている。",u:"業界団体での役割を負担と考えない。外の役割は、内側では手に入らない情報が入る経路になる。"}],

{

 role:"ユーグレナ 代表取締役社長", company:"ユーグレナ",
 since:2005, sector:"バイオ／ヘルスケア", gen:"第2世代", accent:"#86B300", x:44, y:20, status:"filled",
 essay:"<b>99%不可能なことでも459回挑戦すれば成功確率は99%を超える</b>——この計算を実際に著書で示し、500社に断られてから501社目で道が開けた人。母数を設計してから動く、という発想の完成形。\nただし本当の学びは直近にある。バイオ燃料への投資で長く赤字を出し続けたあと、選択と集中と希望退職まで踏み込んで2年で約46億円改善させた。理想を掲げる事業ほど、いつまで赤字を許すかを先に決めておく必要がある。",

  {y:"大学1年",t:"バングラデシュで栄養問題に出会う",p:1,b:"想像していた悲惨さとは違い、人々は前向きで子どもも元気だった。そのギャップに驚いたことが出発点で、助けてあげたいという同情ではなかったと述べている。のちに農学部へ転部し、後輩からミドリムシを教わる。"},
  {y:"2002",t:"あえて銀行に就職する",b:"ビジネスでお金がどう動くかを学ぶため。10年で培養を成功させ、35歳頃にバングラデシュへ持っていくという逆算を、この時点で立てていた。"},
  {y:"2005",t:"退職して創業、その年の12月に世界初の大量培養に成功",p:1,b:"栄養価が高いがゆえに外敵が繁殖してしまうのが最大の壁だった。解決策は、他の生物が 生きられないような環境を人工的に再現すること。きれいな場所で育てない、という発想の転換だった。"},
  {y:"2006",t:"出資元の事件に巻き込まれ、オフィスを追われる",p:1,b:"持ち分を自費で買い取って独立性を保つが、しばらく苦境が続いた。"},
  {y:"2006〜08",t:"500社に断られ続ける",p:1,b:"ミドリムシの説明をした企業すべてから断られた。倒産の危機に瀕したが、501社目にあたる伊藤忠商事が研究開発費を出資し、販売網ごと道が開けた。"},

  {y:"2018〜23",t:"バイオ燃料への投資で赤字が続く",p:1,b:"研究開発型企業として燃料事業に邁進した結果、2023年度には約15億円の営業赤字。"},
  {y:"2024〜26",t:"選択と集中、人事改革、希望退職",p:1,b:"2年で約46億円の改善。2025年度は営業黒字31億円、2026年1〜6月期には9年ぶりの最終黒字に転換した。理想を掲げ続けた人が、期限を切って収益構造に手を入れた局面。"}],
 rules:[
  {h:"断られた回数を成果として数える",s:"99%不可能なことでも459回挑戦すれば成功確率が99%を超える——著書で示した計算。実際に500社に断られた後の501社目で道が開けている。母数を設計してから動く人。",u:"リネンサプライの新規開拓も、成約率ではなく「今月何社に断られたか」を指標にする。断られた数が増えない月は、動いていない月。"},
  {h:"一番になる領域を1つに絞り、あとは組む",s:"自分たちはミドリムシで一番だが、ガソリンスタンドも缶ジュース工場も作らない。既にある大企業のアセットに自分たちの素材を入れる、という徹底したオープンイノベーション。",u:"監理・支援・送り出しのどこで一番になるかを1つ決め、残りは提携で埋める。全部を自前でやろうとしない。"},
  {h:"きれいな環境で育てない",s:"培養の突破口は、他の生物が生きられない過酷な環境を人工的に再現することだった。きれいな場所だけで育てるともやしっ子になる、と本人が人材育成に重ねて語っている。",u:"守られすぎた環境は強さを作らない。ただし過酷さの設計は意図的に、かつ安全の範囲で。放置とは違う。"},
  {h:"16年かかる目標を先に置く",s:"10年で培養を成功させ、35歳でバングラデシュへ——学生時代に立てた逆算をほぼそのまま実行した。年単位ではなく十年単位で計画を持つ。",u:"2030年の構想を、10年計画として日付入りで書く。中期計画は3年ではなく、そのうしろにもう1本長い線を引く。"},
  {h:"妄想を出発点にする",s:"スタートアップは妄想そのもの、という立場。想像のさらに外側にある発想を先に置き、実現手段はあとから積み上げる。",u:"実現可能性から発想すると、既存の延長にしか行けない。まず妄想を書き、そこから逆算して今月の一手を決める。"},
  {h:"ただし、赤字に期限を切る",s:"理想の事業に投資し続けて長く赤字だったが、選択と集中・人事改革・希望退職まで踏み込み、2年で約46億円改善させた。信念と収益規律を両立させた局面が、この人の最新の学び。",u:"理念を掲げる事業ほど、いつまで赤字を許すかを先に決める。期限のない理想は、組織を疲弊させる。"}],

  {h:"市場が移る前に、リソースを寄せておく",s:"ブラウザからアプリへの移行を先読みし、市場が動く前の年から準備を始めていた。波が来てから動くと間に合わない。",u:"2027年の制度移行も同じ構造。変わってから対応するのではなく、いま人と仕組みを寄せる。リネンサプライの先行はまさにこの型。"},
  {h:"走るなら、伸びている場所の中で走る",s:"新幹線の中で走れ、という言い方でインタビューに残っている。同じ努力でも、市場の速度が乗っているかどうかで到達距離が変わるという考え方。",u:"どれだけ真面目に監理しても、縮む領域では成果が出にくい。伸びる産業の受入企業を選ぶこと自体が戦略になる。"},

  {h:"二者択一を、両方取る形に作り変える",s:"起業か就職かではなく、起業したまま新卒入社する。ゼロから独立するか大企業に残るかではなく、傘の中で作ってからMBOで買い取る。選択肢を選ばず、条件を交渉して増やしている。",u:"監理事業を続けるかSaaSに賭けるか、という二択で悩まない。本業のキャッシュで開発を回す形が、この人の型でいう別解。"},
  {h:"人が2倍やるなら10倍やる",s:"後発で追いつくために働いた量を、率直に語っている。フレームワークの人でありながら、土台は量。",u:"別解も量から生まれる。案を3つで止めない。10案出してから選ぶ。"},
  {h:"会う量を稼ぐ",s:"学生時代に1万人に会うという企画を自分で立てて実行している。人脈を偶然に任せず、企画として量をこなした。",u:"業界団体や紹介ルートを待たず、月に会う人数を目標として置く。母数が機会の数を決める。"},
  {h:"集客とマネタイズをセットで設計する",s:"役務としての価値をバンドルしていないWebサービスは、月に億のインプレッションがあっても売上が立たない。ネットの起業家はここで失敗することが多い、と指摘している。",u:"ミエテルもboketto も同じ。人を集めてから収益を考えるのではなく、何の役務に対価が発生するかを先に決める。"},
  {h:"連続増収増益を自分への制約として課す",s:"上場以来10期以上の連続増収増益を掲げ続けている。制約を先に置くことで、無理な投資も無理な緊縮もできない構造を作っている。",u:"成長率の下限を自分で宣言する。制約があるほうが、判断は速くなる。"}],

{

 ctype:"創業", born:1978,
 role:"CAMPFIRE 代表取締役／連続起業家・投資家", company:"CAMPFIRE ほか",
 since:2001, sector:"クラウドファンディング／コミュニティ", gen:"第2世代", accent:"#E5541B", x:90, y:22, status:"filled",
 essay:"65人で唯一、<b>弱さが資産として機能している</b>人。上場で得た十数億円を2年で使い果たしたことまで自著で明かし、自分の駄目さを受け入れて、できる人に助けてもらうのが上手いと評される。\n重要なのは、居場所がなかった人間が居場所を作り、金がなかった人間が金の流れを作ったこと。原体験と事業テーマが完全に一致している。縁道と構造が同じなので、あなたには読みどころが多いはずだ。",
 thesis:"自分の欠落から事業をつくる。市場規模ではなく、制度からこぼれ落ちた人のほうを見る。",
 spec:[["BORN","1978 / 福岡県"],["TEENS","いじめ・不登校・3年のひきこもり"],["FOUNDED","22歳でpaperboy&co."],["IPO","2008 JASDAQ 当時最年少"],["ELECTION","2014 都知事選 約9万票・5位"],["NOW","VC・100社近くに投資"]],
 pivots:[
  {y:"中学2年",t:"いじめをきっかけに不登校、3年のひきこもり",p:1,b:"高校も中退。大検に合格し地元の美術大学にも受かるが、家庭の事情で通えなかった。居場所がなかったという原体験が、のちの事業すべての出発点になっている。"},
  {y:"〜2001",t:"デザイン会社からシステム会社へ",b:"Webデザインに興味を持ち、技術を身につけるために転職。独学に近い形で手を動かせるようになる。"},
  {y:"2001",t:"paperboy&co.を福岡で創業",p:1,b:"新聞配達をしながら夢を追った経験にちなんだ社名。ロリポップなど、専門知識のない個人が使えるサービスを次々に出す。"},
  {y:"2008",t:"JASDAQに当時最年少で上場、そして退任",p:1,b:"上場という到達点のあとに退任。バイアウトで得た十数億円を2年で使い果たしたと、自著で率直に明かしている。頂点で居場所を失う経験が、その後のテーマを決めた。"},
  {y:"2011〜",t:"CAMPFIRE、BASE、リバ邸",p:1,b:"クラウドファンディング、ネットショップ作成、現代の駆け込み寺としてのシェアハウス。資金・販路・住処という、こぼれ落ちた人に足りていないものを順番に配りにいく。"},
  {y:"2014",t:"東京都知事選に出馬、約9万票で5位",b:"SNSを軸にした選挙戦。落選も活動の一部として続けている。"},
  {y:"2018〜",t:"VCのNOWを設立、支援する側へ",b:"ファンドを組成し、個人分を含め100社近くに投資。起業家向けのメンタルケアプログラムの立ち上げにも関わる。"},
  {y:"2025",t:"地方企業の共同代表に就任",b:"地域の居場所づくりへ軸足を広げている。"}],
 rules:[
  {h:"自分の欠落から事業をつくる",s:"居場所がなかった人間が居場所をつくり、お金がなかった人間がお金の流れをつくる。原体験と事業テーマが一致しているため、流行が変わっても軸がぶれない。",u:"新規事業を市場規模から発想しない。自分か、自分の身近な人が実際に困った場面を起点にする。縁道の発想と構造が同じ。"},
  {h:"弱さを先に開示する",s:"自分の駄目さを受け入れて、しっかりした人に助けてもらうのが上手い——周囲からそう評される。完璧な経営者を演じないことで、補完してくれる人が集まる設計になっている。",u:"苦手を隠さず、できる人に渡す。低ITリテラシーのチームでも、社長が分からないと言える空気があるほうが導入は進む。"},
  {h:"制度からこぼれた人を見る",s:"銀行から借りられない人にはクラウドファンディング、店を持てない人にはネットショップ、家に居られない人にはシェアハウス。既存の仕組みが拾わない層を一貫して対象にしている。",u:"監理団体の顧客も同じ構造。大手が相手にしない小規模事業者や、制度の隙間にいる人こそ市場になる。"},
  {h:"立ち上げたら、次の担い手に渡す",s:"表現者として事業を立ち上げ、想いを次に引き継ぐという言い方をする。複数社を創業しては手放してきた履歴そのものがこの原則の証拠。",u:"自分が作った仕組みを、抱え続けない。渡す前提で設計すると、最初からドキュメントが残る。"},
  {h:"落選も失敗も、活動の一部として続ける",s:"都知事選での落選、上場後の退任、資金を使い果たした時期。いずれも隠さず語り、そのまま次の活動につなげている。撤退が終了を意味しない構え方。",u:"うまくいかなかった事業を、なかったことにして黙らない。経緯を書いて公開すると、次の協力者が来る。"},
  {h:"プロダクトより先に場をつくる",s:"リバ邸や各種コミュニティのように、まず人が集まる場所を用意し、そこから事業が生まれている。順番が普通と逆。",u:"ミエテルのようなサービスも、機能を磨く前に使う人の集まる場を先に持つと、改善の速度が変わる。"}],
 fail:{t:"自分が消耗しきったときの手順",items:[

  {b:"一人で抱えず、場に持ち込む",s:"起業家向けのメンタルケアの必要性を、自ら仕組みとして立ち上げているほど重視している。"},

 essay:"失敗の開示を戦略にしている唯一の人。<b>仮想通貨事業の事実上の撤退、全社員が白けたバリュー発表、明け方のコンビニで泣いた夜まで章題にして本にした。</b>若手起業家に同じ失敗をさせないため、と本人は言う。\nあなたに効くのは「10言って1つやってもらえたら御の字」。1回言って伝わらないのは異常ではない、と思えるだけで、システム導入の進め方が変わる。松本大の下で学んだ「一発逆転はない」もセットで効く。",

 pivots:[
  {y:"2001",t:"ソニー入社、希望と違う経理配属",b:"ビジネスを作る側に行きたいのに数字の管理側。3年間は簿記と会計の勉強に充てつつ、社内公募でマネックス証券への出向を勝ち取る。"},
  {y:"2004〜",t:"マネックス証券で松本大の下につく",p:1,b:"手を挙げれば何でもやらせてもらえる環境で、失敗も大量にした一番伸びた時期だったと振り返る。同時に「ビジネスに一発逆転はない」ことを毎日の積み重ねから思い知らされたという。"},
  {y:"2011",t:"留学中に「マネーブック」を構想",b:"資産運用のうまい人のやり方を共有できる、お金版SNSのようなアイデア。集合知とお金がキーワードだった。"},
  {y:"2012",t:"社内新規事業として却下され、自分でやる",p:1,b:"マネックスの新規事業として提案したが、リーマン・ショック後で新規投資は難しいという判断。そこで独立を決める。最終的にマネックスからも出資を受け、松本大の応援も得た。断られ方が円満だった点が後の展開を支えている。"},
  {y:"2017",t:"フィンテック企業として国内初の東証マザーズ上場"},

  {y:"現在",t:"SaaS×Fintechのグループへ",b:"中小企業向けバックオフィスSaaSが売上の柱。個人向け家計簿と合わせ、経営管理のコンサル領域まで広げている。"}],
 rules:[
  {h:"失敗したら、利用者目線に立ち返る",s:"様々な失敗を重ねてきたが、そのたびに立ち返ったのは利用者目線だったと述べている。判断の迷子になったときの帰還点を1つに固定している。",u:"新機能や新サービスで揉めたら、実習生・監理担当・受入企業のうち誰の目線に立ち返るかを先に決めておく。帰還点がないチームは議論が終わらない。"},
  {h:"失敗を、先に、自分から言葉にする",s:"自社の失敗を1冊の本にまとめて公開した。隠さず語ることで、同じ失敗をする起業家を減らせるという考え方。結果として信頼と人材が集まる構造になっている。",u:"OTITへの改善報告も、社内の振り返りも同じ。先に自分から出したものは資産になり、隠して見つかったものは負債になる。"},
  {h:"10言って1つやってもらえたら御の字と考える",s:"組織は100%自分の思いどおりには動かない。この実行率が普通だという前提を置くことで、伝え続けることができるし、消耗も減る。",u:"6人チームへの新システム導入で、1回言って伝わらないのは異常ではない。同じことを10回言う前提でスケジュールを引く。"},
  {h:"ビジネスに一発逆転はない",s:"マネックス時代に、抜群に優秀な経営者のハードワークと毎日の積み重ねを間近で見て思い知らされたという原体験。一撃で状況を変える手を探さない。",u:"リネンサプライ参入も、1社の大型契約を狙うより、事前予約リストを1件ずつ積むほうが確実に速い。"},
  {h:"やらない後悔をしない",s:"死ぬわけではないし、起業しないと後悔すると思った——独立を決めたときの整理。リスクの大きさではなく、後悔の大きさで比較している。",u:"新規事業の判断を損益だけで比べない。やらなかった場合に3年後の自分が後悔するかを、同じ重さで並べる。"},
  {h:"嫌われたくない社長でいい",s:"強いリーダー像を演じるのではなく、弱さを認めたうえで他力を集めて最強になる、という構え方を自著の章立てにまで置いている。",u:"強がらないほうが人は動く。分からないことを分からないと言えるほうが、現場からの情報が上がってくる。"}],

{
 id:"sasaki", name:"佐々木 大輔", roma:"SASAKI DAISUKE",
 ctype:"創業", born:1980,
 role:"freee 代表取締役CEO", company:"freee",
 since:2012, sector:"SaaS／スモールビジネス", gen:"第3世代", accent:"#7C3AED", x:56, y:70, status:"filled",
 essay:"65人であなたと最も構造が近い。<b>FAXやチラシが主流だった日本のスモールビジネスという、キラキラしていない領域に賭けた</b>。しかも動機の一つが、祖父の代から続く実家の美容院で見た煩雑な雑務だった。\n監理団体・技能実習・リネンサプライ。まさにキラキラしていない領域で、だからこそ余白が大きい。「倍率の低いほうを選ぶ」という留学先の決め方まで含めて、この人のルールはほぼそのまま流用できる。",
 thesis:"キラキラしていないところに着目する。倍率の低いほうを選び、実家で見た光景を仕様にする。",
 spec:[["BORN","1980 / 東京・実家は美容院"],["CAREER","博報堂 → 投資ファンド → スタートアップ → Google"],["FOUNDED","2012年7月"],["LAUNCH","2013年3月 全自動クラウド会計"],["IPO","2019年12月 東証マザーズ"],["CULTURE","マジ価値2原則"]],
 pivots:[
  {y:"大学期",t:"倍率が一番低いという理由で留学先を選ぶ",p:1,b:"交換留学でスウェーデンを選んだ理由は、倍率が低くて受かりやすいことと、他の人がやらない経験をしてみたかったこと。逆張りの原型がここにある。"},
  {y:"2004〜",t:"博報堂、投資ファンド、スタートアップのCFO兼開発",b:"データ分析を軸に、広告・投資・開発と職種を横断している。"},
  {y:"2008",t:"Googleへ。望んだ配属ではない場所で原体験を得る",p:1,b:"不景気で外資系が直接お金につながる仕事にリソースを集中させた結果、中小企業向けマーケティングの担当に。そこで、日本のスモールビジネスにテクノロジーが届いていない現実を目の当たりにした。偶然の配属を原体験に変えている。"},
  {y:"〜2012",t:"実家の美容院の雑務を思い出す",p:1,b:"祖父の代から続く美容院で、煩雑な事務作業を間近に見て育った。中小企業を応援したいと考えた理由の1つに、この光景を挙げている。"},
  {y:"2012",t:"Googleを辞めて創業。プロトタイプは在籍中に自分で作っていた",p:1},
  {y:"2013",t:"全自動のクラウド会計をリリース"},
  {y:"2018",t:"500人を超えた時点でカルチャーを再定義",p:1,b:"「マジ価値2原則」と5つの指針に集約し、絶対にぶれさせたくないものを言語化した。人数の増加を、言葉を作り直すタイミングとして扱っている。"},
  {y:"2019",t:"東証マザーズ上場"}],
 rules:[
  {h:"キラキラしていないところに着目する",s:"華やかな市場ではなく、FAXやチラシで回っていた日本のスモールビジネスに賭けた。地味で、誰も手をつけていない領域にこそ機会があるという見方。",u:"監理団体・技能実習・リネンサプライ。まさにキラキラしていない領域で、だからこそテクノロジーの余白が大きい。この人の型はあなたの事業構造とほぼ同じ。"},
  {h:"倍率の低いほうを選ぶ",s:"留学先の選び方からして、受かりやすさと、他の人がやらない経験を基準にしている。競争率の低さを機会として読む癖。",u:"人が集まる領域より、誰も応募しない領域を狙う。採用も市場選定も同じ理屈。"},
  {h:"偶然与えられた場所を、原体験に変える",s:"中小企業向けマーケティングは希望した配属ではなかったが、そこで見た現実が会社の存在理由になっている。配属の良し悪しではなく、そこで何を見るか。",u:"望まない案件や面倒な顧客対応こそ、事業の種が落ちている。愚痴で終わらせず、観察して書き留める。"},
  {h:"実家で見た光景を仕様にする",s:"美容院を営む家庭で見た煩雑な雑務が、プロダクトの原型になっている。統計ではなく、生活の中で見た具体的な困りごとから設計している。",u:"実習生や受入企業の現場で見た一場面を、そのまま機能要件に翻訳する。ヒアリング資料より強い。"},
  {h:"人数が増えたら、言葉を作り直す",s:"500人を超えた段階でカルチャーを再定義し、原則と指針として集約した。組織の規模が変わったら理念の表現も更新が要る、という前提。",u:"6人のいまの縁道の説明と、30人になったときの説明は同じでは通用しない。人数の節目で書き直す。"},
  {h:"辞める前にプロトタイプを作る",s:"アイデアを考え、自分で試作品まで作ったのはGoogle在籍中。構想だけで飛び出さず、動くものを持って出ている。",u:"新規事業は、いまの体制のまま動くものを1つ作ってから判断する。"}],
 fail:{t:"事業の意味が薄れたときの手順",items:[
  {b:"誰のためかを、具体的な1人の顔に戻す",s:"実家の美容院にあたる存在を思い出す。統計ではなく人。"},
  {b:"キラキラした市場に逃げていないか確認する",s:"地味な領域から離れた瞬間に、優位性が消える。"},

{
 id:"miyata", name:"宮田 昇始", roma:"MIYATA SHOJI",
 ctype:"創業",
 role:"Nstock 代表取締役CEO（SmartHR 創業者）", company:"SmartHR / Nstock",
 since:2013, sector:"HR SaaS／株式報酬", gen:"第3世代", accent:"#00A5CF", x:64, y:58, status:"filled",
 essay:"原体験は探すものではなく思い出すもの、と教えてくれる人。<b>難病で倒れた際に社会保険で2か月分の生活費が保障され療養に専念できた。もし手続きの煩雑さで受給が遅れる人がいたら——これは自分たちがやるべきだ、と確信した。</b>\n10万人に1人のレベルまで重症化し、一時は車椅子。そこから2年で10回以上外してSmartHRに辿り着く。あなたが制度に助けられた場面、苦しんだ場面を10個書き出すと、監理ナビの要件が出てくる。",
 thesis:"10回以上外す前提で始める。そして自分が実際に助けられた制度から、事業を立ち上げる。",
 spec:[["BEFORE","Webディレクター"],["ILLNESS","ハント症候群（重症化・一時は車椅子）"],["FOUNDED","2013 株式会社KUFU"],["PIVOTS","2年で10回以上の失敗"],["UNICORN","2021 156億円調達"],["HANDOVER","2022 CEO退任 → Nstock創業"]],
 pivots:[
  {y:"20代",t:"難病で倒れ、神経が戻るか分からないと言われる",p:1,b:"ハント症候群を発症し、10万人に1人といわれるレベルまで重症化。一時は車椅子が必要になった。傷ついた神経がもとに戻るか分からないと告げられ、先が見えなくなるほどのショックを受ける。回復後、これからは自分の好きなことをして生きようと決めて会社を辞めた。"},
  {y:"2013",t:"友人と創業。そこから2年間で10回以上外す",p:1,b:"法人向けITサービス比較サイトなど、次々に失敗。シードアクセラレーターでも複数のアイデアを潰し、ようやく身近なところに課題を見つけた。"},
  {y:"2014頃",t:"療養中に自分が助かった制度を思い出す",p:1,b:"病気のとき、社会保険によって2か月ほど生活費が保障され、療養に専念できて完治した。もし手続きが煩雑だという理由で受給が遅れたり受け取れない人がいたら——これは自分たちがやるべきビジネスだ、と確信した瞬間だったと語っている。原体験は探すものではなく、思い出すものだった。"},
  {y:"2015",t:"SmartHRを公開",b:"社会保険・雇用保険の手続きをオンラインで完結させるサービス。顧客継続率98%前後を維持しながら急拡大した。"},
  {y:"2021",t:"海外投資家などから156億円を調達、ユニコーンへ"},
  {y:"2022",t:"CEOを退任し、翌月に新会社を立ち上げる",p:1,b:"やることを決めてから退任したわけではなく、このアイデアがなければ社内ニートだった可能性もある、と本人が笑って語っている。降りたあとの空白を怖がっていない。"},
  {y:"2024〜25",t:"高専へ10億円の寄付を決定、SmartHR取締役も退任",p:1,b:"株式の売却益をもとに、若い世代の起業挑戦を支える基金を設立。得た資産を次の世代の母数に変えている。"}],
 rules:[
  {h:"10回以上外す前提で数える",s:"2年間で10回以上の失敗を経てSmartHRに辿り着いている。当たるまでの回数を織り込んでいるから、1回ごとの失敗で止まらない。",u:"新規事業の企画を1本ずつ真剣に検討しない。10本並べて、潰す前提で回す。潰した数が進捗になる。"},
  {h:"自分が助けられた経験から事業を作る",s:"社会保険で救われた当事者だからこそ、手続きの煩雑さが誰かの受給を妨げる可能性に気づけた。市場調査ではなく、自分の身に起きたことが起点。",u:"あなたが制度に助けられた場面、逆に苦しんだ場面を10個書き出す。監理ナビの機能要件は、そこに埋まっている。"},
  {h:"そこにユーザーの課題はあるのか、だけを問う",s:"アイデアを潰す基準がこの一問。エンジニアがサービス選定を楽しんでいた比較サイトは、需要がないと判断して切っている。作り手が楽しいことと、課題があることを混同しない。",u:"機能追加の要望が来たら、要望の裏に本当の課題があるかを確認する。言われたまま作ると、使われない機能が増える。"},
  {h:"病気の経験を、生き方の決定に使う",s:"神経が戻るか分からないと言われた経験のあとに、好きなことをして生きようと決めて会社を辞めている。健康の危機を、キャリアの決定打として扱った。",u:"体調を崩したときは、休むだけでなく、優先順位を書き直す機会として使う。"},
  {h:"次を決めずに降りる",s:"CEO退任時点で次にやることは決まっていなかった。空白を先に作ったから、新しいアイデアが入る余地ができている。",u:"引き継ぎの計画に、次の役割を決めない期間をあえて置く。埋めてから降りると、同じことを繰り返す。"},
  {h:"得た資産を、次の母数に変える",s:"株式売却益から10億円の寄付を決め、学生の起業挑戦を後押しする基金にしている。自分が10回外して当てた経験を、他人が外せる回数に変換している。",u:"あなたの場合はインドネシアの学校。利益を、次の挑戦者の試行回数に変える設計を持つ。"}],
 fail:{t:"アイデアが当たらないときの手順",items:[
  {b:"当たるまでの回数を先に決める",s:"10回外して普通。1回目で落ち込むのは設計が甘い。"},
  {b:"自分が助けられた経験を棚卸しする",s:"原体験は探すのではなく思い出す。"},
  {b:"そこにユーザーの課題があるかだけを問う",s:"作り手が楽しいだけの企画を、この一問で落とす。"},

  {b:"当たったら一気に張る",s:"外し続ける時期と、当たった後の集中は別の動き方。"}]},

{
 id:"fukushima", name:"福島 良典", roma:"FUKUSHIMA YOSHINORI",
 ctype:"創業",
 role:"LayerX 代表取締役CEO（Gunosy 創業者）", company:"LayerX",
 since:2012, sector:"AI／SaaS／フィンテック", gen:"第3世代", accent:"#1F2329", x:74, y:56, status:"filled",
 essay:"NFTで市場が最も盛り上がっていた時期に、祖業のブロックチェーンを捨てると宣言した人。<b>売上は立っていたが限界を感じ、30名ほどの従業員を説得したうえで撤退している。</b>\nそして「成功体験は隙になる」。フラットな組織を含む定説を過信して失敗した4例を実名で公開している。定説には成立条件がある——青野慶久の型を導入しようとするときは、この人の警告とセットで読むのが正しい。",
 thesis:"成功体験を「隙」として扱う。極めたものを捨て、初心者の視点に戻れるかで次が決まる。",
 spec:[["EDUCATION","東大大学院・機械学習"],["GUNOSY","2012年創業 → 2015年上場（2年4か月）"],["AWARD","IPA未踏スーパークリエータ"],["LAYERX","2018年設立 → 2019年MBOで独立"],["PIVOT","2021年8月 ブロックチェーンをやめる宣言"],["NOW","AIエージェント事業・シリーズBで150億円"]],
 pivots:[
  {y:"2011",t:"趣味として公開したサービスが母体になる",b:"大学院の同級生と趣味で出したものが、そのままGunosyになった。狙って始めていない。"},
  {y:"2012〜15",t:"創業から2年4か月で東証マザーズ上場",p:1,b:"学生起業家ブームの先駆けとなる圧倒的な速度。だが本人は後に、この時期に4つの失敗をしたと公開で語っている。"},
  {y:"〜2018",t:"ビジネスの定説を過信し、フラットな組織が崩壊",p:1,b:"世に言われている経営の定石をそのまま採用した結果うまくいかなかった、という反省を実名で語っている。定説は自社の条件では成立しないことがある、という学び。"},
  {y:"2018〜19",t:"ブロックチェーン子会社を立ち上げ、MBOで独立",p:1,b:"Gunosyで培った技術を軸に新会社を設立し、翌年には自ら買い取って独立している。"},
  {y:"2021",t:"祖業であるブロックチェーンからの撤退を宣言",p:1,b:"NFTなどで市場が最も盛り上がっていた時期に、あえて祖業を捨てる声明を出した。売上は立っていたが限界を感じ、30名ほどの従業員を説得して撤退。地方銀行とのプロジェクトから出たアイデアを原型に、法人支出管理のサービスへ舵を切った。"},
  {y:"2024〜",t:"AIエージェント事業へ",p:1,b:"ソフトウェアの提供者から、業務そのものを担う側へ移ろうとしている。技術トレンドに乗るのではなく、顧客の業務を起点に技術を選び直す動き。"}],
 rules:[
  {h:"成功体験を「隙」として扱う",s:"一度成功すると、こうすればうまくいくという固定観念が無意識に生まれ、泥臭い戦い方では隙になる。Gunosyでの経験がそのままLayerXで通用しなかった事実を、自ら認めている。",u:"ARCANAでうまくいった進め方を、監理ナビにそのまま持ち込まない。前回の成功要因が今回の前提と一致しているかを、毎回確認する。"},
  {h:"ビジネスの定説を過信しない",s:"フラットな組織をはじめ、世間で正しいとされる経営手法を採用して失敗した経験を公開している。定説には成立条件があり、自社の条件と合わなければ機能しない。",u:"心理的安全性もフラット化も、6人の多国籍チームで同じように効くとは限らない。定説を導入するときは、成立条件を先に書き出す。"},
  {h:"技術に惚れない。顧客の課題から選ぶ",s:"最も市場が盛り上がっていた局面で祖業のブロックチェーンを捨て、顧客の業務課題に直結する領域へ移った。技術は目的ではなく手段だという判断を、痛みを伴う形で実行している。",u:"AIも同じ。生成AIを使うことが目的化していないか。監理業務のどの工程が解決されるかを先に書く。"},
  {h:"極めたものを捨て去る覚悟を持つ",s:"自らも投資家として、極めたものを捨てられる起業家に賭けたいと語っている。積み上げた専門性が最大の足枷になる局面がある、という認識。",u:"技能実習という枠組み自体が2027年に変わる。これまで積み上げた運用ノウハウのうち、捨てるべきものを先にリストにする。"},
  {h:"撤退は、社員を説得してから実行する",s:"祖業からの撤退時、30名ほどの従業員を説得したうえで決断している。トップダウンで方向転換だけを告げていない。",u:"事業転換は宣言ではなく説得。全員に個別で理由を話す時間を、スケジュールに組む。"},
  {h:"組む相手には、大きく持たせる",s:"学生起業だったGunosyで連続起業家と共同創業したことを大きな成功要因に挙げ、数%ではなく10〜20%以上渡してでも同じ船に乗せるべきだと述べている。",u:"提携やジョイントベンチャーで、相手の取り分を絞りすぎない。当事者にするかどうかで動きがまるで変わる。"}],

{

 pivots:[

  {y:"2010〜11",t:"留学先でクラウドファンディングに出会う",p:1,b:"シリコンバレーでは起業家が誰よりも尊敬され、優秀な人は起業するのが当たり前だった。周囲に起業家が1人もいなかった自分にとって衝撃だったと語る。そして広まり始めていたクラウドファンディングを見て、これだ、と直感した。"},

 thesis:"創業者にならず、2人目になる。情報の流れ方と意思決定の仕組みを変えることが、この人にとっての経営。",

{

 pivots:[

  {h:"不完全さが人の心を動かすと知る",s:"起動しないロボットを人が応援し、動いた瞬間に喜んだ。完璧さより、手をかけさせることが関係を作るという発見。",u:"支援も同じかもしれない。完璧に先回りするより、一緒に苦労する場面があるほうが関係は深くなる。"},

 pivots:[

  {y:"1990",t:"リゾートホテルの不良債権回収を担当する",p:1,b:"外資系金融で、採算の合わない計画に巨額の資金が投じられ破綻していく現場を見た。理論通りに考えればうまくいかない理由は最初から明確なのに、そこに投資してしまう心理がある——追放された期間が、最良の教材になっている。"},

 rules:[

  {y:"1918",t:"二畳ほどの場所で創業する",p:1,b:"電球ソケットから始め、二股ソケットが爆発的に売れた。価格を従来品の半額以下に抑えながら品質を上げるという、のちの思想の原型がここにある。"},

  {h:"信頼を、コストより上に置く",s:"半日分の工賃は長い目で見ればたいしたことはない、それより従業員を解雇して信頼にヒビが入るほうが問題だ——という比較をしている。短期の数字と長期の信頼を、明示的に天秤にかけた。",u:"ゼロ失踪10年という信頼は、短期のコスト削減より価値が高い。数字にならない資産を、判断のときに数字と並べる。"},

  {y:"1934〜",t:"ピストンリングが作れず、大学に学びに行く",p:1,b:"自分で部品を作ろうとしたが強度が足りず、高等工業学校の教授に相談して金属技術を学び直した。職人の勘だけでは足りないと知って、理論を取りに行っている。"},
  {y:"1945",t:"地震で工場が倒壊し、会社を売却する",p:1,b:"戦争と災害ですべてを失った。売却後は酒造りや製塩、アイスキャンデー製造機まで手がけている。何もない期間に、手を動かし続けた。"},
  {y:"1946〜48",t:"自転車にエンジンを付けて再起する",p:1,b:"旧軍の小型エンジンに目をつけ、自転車に載せた。これが評判となり、本田技研工業の設立につながる。"},

  {y:"1960年代末",t:"空冷エンジンへの固執と、若い技術者との対立",p:1,b:"世界に通用するエンジンは空冷でなければならないと主張し続けたが、若手技術者は水冷を推した。創業者の技術的信念が、組織の前進を止める側に回った局面。"},

  {h:"やってみもせんで、何がわかる",s:"議論よりも試作を優先し、実際に作って走らせることで判断してきた。机上の否定を認めない姿勢が、技術者集団の文化になった。",u:"監理ナビもミエテルも、企画書で議論する時間を短くして、動くものを出す。あなたの作り方はすでにこの型。"},

  {h:"苦しいときほど、外に高い目標を掲げる",s:"経営難のさなかに世界最高峰のレースへの参戦を宣言し、社内の士気を立て直した。内向きの引き締めではなく、外向きの宣言を選んでいる。",u:"厳しい期こそ、対外的な目標を掲げる。守りに入った宣言は組織を縮ませる。"},
  {h:"⚠️創業者の技術的信念が、会社を止めることがある",s:"空冷エンジンへの固執は、若手技術者との対立を生んだ。最も得意な領域だからこそ、判断を誤った。福島良典の「成功体験は隙になる」の実例。",u:"あなたが最も詳しい領域（システム、AI）でこそ、若手の反対意見を通す仕組みを作る。得意分野が盲点になる。"},

  {y:"1972",t:"親戚から40万円を借りて、アメリカへ行く",p:1,b:"家具業界の研修セミナーに参加し、アメリカの住まいの豊かさに衝撃を受ける。ここで人生観が反転した。あきらめの人生から、ロマンを抱く人生へ。"},
  {y:"帰国後",t:"「所得は3倍にできないが、価格は3分の1にできる」",p:1,b:"アメリカのような豊かな暮らしを日本で実現するという志を、価格という具体策に翻訳した。品質を維持したまま価格を3割下げると決めて走り出し、それが製造小売業への転換につながる。"},
  {y:"以後",t:"60年計画を立て、前半30年で100店を目指す",p:1,b:"計画時点の店舗は札幌市内の7店だけ。それでも全国100店という目標を置き、計画から1年遅れの2003年に達成している。"},
  {y:"現在",t:"30期以上の連続増収増益、そして世界へ",b:"製造・物流・IT・小売を一気通貫で持つモデルを確立し、海外展開を進めている。"}],

  {h:"志を、具体的な数値に翻訳する",s:"豊かな暮らしを実現するという抽象的な志を、所得は3倍にできないが価格は3分の1にできる、という数式に落としている。理念を実行可能な形にした瞬間。",u:"縁道を数式にすると何になるか。失踪率ゼロ、手数料◯円以下、定着率◯%。志は数字にして初めて動く。"},

  {h:"長期計画のない成功はないと考える",s:"この長期計画なくして成功した例は過去にない、と言い切っている。短期決戦型から長期計画型へ、研修を境に完全に切り替えた。",u:"3年計画の後ろに、10年、30年の線を引く。塚越寛の年輪経営とは速度が正反対だが、長期で見る点は同じ。"},
  {h:"どん底で、借金してでも外を見に行く",s:"借金を抱えた最中に、さらに親戚から40万円を借りて海外へ出ている。苦しいときに視察に出るという判断が、すべてを変えた。",u:"苦しい時期こそ、現場を離れて外を見る。金と時間がないときほど、この投資の効果が大きい。"},
  {h:"エリートでないことを、前提として使う",s:"広告会社を半年で解雇され、学歴も商才もないところから始まっている。持たざる出発が、顧客と同じ目線を保たせている。",u:"松下幸之助と同じ型。資源のなさを、始めない理由にしない。"}],

  {h:"⚠️信任を失ったと判断したら、即座に降りる",s:"反対票が社内から出るようなら、票数に関係なくもはや信任されていない——そう述べて同日に引退を表明した。潔さである一方、自らの責任には触れず周囲への批判が口をついたとも報じられている。",u:"降り方は、それまでの功績の評価を左右する。永守重信の例と並べて読むと、説明責任の重さが分かる。"},

  {h:"どん底で、返せると言ってくれる人を1人持つ",s:"酒に溺れていた時期に、税理士から本気で返すなら返せない金じゃないと言われて奮起している。数字が分かる人間の冷静な言葉が、立ち直りの起点になった。",u:"追い込まれたときに、感情ではなく数字で状況を説明してくれる相手を確保しておく。"},

 essay:"ゼロからの再出発が凄まじい。<b>パリから戦時下の日本へ戻され、徴兵、中国での収容所。たどり着いた家は焼け野原で、アトリエもパリ時代の作品もすべて失っていた。</b>\nそして評価の時差。1950年の対極主義の宣言は賛同を得られず流会になり、亡くなった当時は変人のように扱われ、縄文土器論は考古学の世界で約半世紀無視された。⚠️を付けたのは慰めではなく時間軸の話としてだ。正しさが認められるまでの年数を、計画に織り込む必要がある。",
 thesis:"対極を同居させる。心地よいほうではなく、危険なほうを選ぶ。",

 pivots:[

  {y:"パリ期",t:"認められたいという野心が先行していることに気づく",p:1,b:"留学中に苦悩し、営利や名誉ではなく、自分の情熱を純粋に爆発させることが自分のやるべきことだと考えるに至った、とされる。動機の側を作り直している。"},
  {y:"1940〜46",t:"帰国、出征、そして収容所",p:1,b:"自由の国から軍国主義下の日本へ引き戻され、戦場を経て中国での収容所生活。ようやく帰り着いた家は焼け野原で、アトリエもパリ時代の作品もすべて失われていた。文字通りゼロからの出発。"},
  {y:"1950",t:"対極主義を宣言するが、賛同を得られず流会になる",p:1,b:"展覧会の開会日に宣言文を読み上げ、協会の結成を呼びかけたが、集まらなかった。理論を掲げた瞬間に受け入れられたわけではない。"},
  {y:"1951",t:"博物館で縄文土器を見て、衝撃を受ける",p:1,b:"翌年その衝撃を論文として発表する。日本美術の系譜の外に置かれていた縄文を、美として提示した。ただしこの縄文土器論は、考古学の世界では半世紀にわたって無視され続けたとされる。"},
  {y:"1970",t:"万博のテーマ・プロデューサーとして太陽の塔を作る",p:1,b:"進歩と調和を掲げた博覧会の中心に、それに逆らうような塔を建てた。祭りの真ん中で、祭りに逆らう。"},
  {y:"没後",t:"変人扱いから、正当な評価へ",p:1,b:"1996年の死去当時は変人のように扱われることがほとんどだった、と研究者が証言している。評価が定まるまでに死後の時間を要した。"}],
 rules:[
  {h:"対極を、同居させる",s:"主題から技法まで、あらゆるものを対極的にとらえる対極主義を掲げた。調和させるのではなく、矛盾したまま同じ画面に置く。",u:"監理とSaaS、日本とインドネシア、規律と自由。無理に統合せず、対極のまま持つほうが強い場合がある。"},
  {h:"心地よいほうではなく、危険なほうを選ぶ",s:"進歩と調和がテーマの万博で、それに逆らう塔を中心に建てた。安全な選択肢を取らないことを、方法として一貫させている。",u:"⚠️劇薬。ただし、全部を安全側に倒した事業には、記憶に残る要素が残らない。1箇所だけ危険なほうを選ぶ。"},
  {h:"評価の外にあるものを、美として引き上げる",s:"当時の美術史の系譜の外にあった縄文土器を、衝撃として受け止めて論文にした。既存の評価軸が見落としているものを拾う。",u:"⭐️佐々木大輔のキラキラしていない領域と同じ構造。監理も技能実習も、評価軸の外にある。そこに価値を見出して言葉にする役は、まだ空いている。"},
  {h:"賛同が集まらなくても、宣言する",s:"対極主義の結成呼びかけは流会に終わった。それでも理論を掲げ続け、後に思想として残っている。",u:"最初の提言に人が集まらないのは普通。掲げ続けることに意味がある。"},

 since:1989, sector:"人材／通信／映像配信", gen:"第1世代", accent:"#1D3F73", x:72, y:46, status:"filled",

 thesis:"1000億円超の損失で社長を降りた人が、47歳から作り直した。借りたものは返す、仲間は見捨てない——この2つだけを軸にしている。",

  {y:"1989",t:"父に勘当されたまま、26歳で起業する",p:1,b:"父は有線放送会社の創業者だったが、継ぐ気はなく自分で人材サービスの会社を立ち上げた。起業を告げた際に勘当だと言われ、父が病床に就くまで口を利かなかったという。継承の物語が、断絶から始まっている。"},
  {y:"1998",t:"病に倒れた父の会社を、35歳で継ぐ",p:1,b:"引き継いだケーブル網は、無許可で張り巡らせた違法な状態だった。まずそれを正す作業から始めている。同時に、ISDNすらない時代に光ファイバーを張り合わせる決断をした。負の遺産の処理と、次世代への投資を同時にやっている。"},
  {y:"2000年代",t:"ブロードバンドに全面投資する",b:"来るべき通信環境を読んで先行投資を重ねた。この判断自体は正しかったが、資金構造に負荷を残した。"},
  {y:"2009〜10",t:"リーマン・ショックで1000億円超の損失。社長を退く",p:1,b:"金融機関との対立を経て、自ら社長の座を降りている。父から継いだ会社を、自分の代で危機に追い込んだという形。このアーカイブの中でも最大級の落差。"},
  {y:"2010",t:"47歳で、事業を1つ切り出して再出発する",p:1,b:"映像配信事業を分離独立させ、その社長として再スタートを切った。上場企業の社長からベンチャーの社長へ。降りたあとに、規模の小さい場所へ自分から戻っている。"},
  {y:"2014〜17",t:"再上場、そして統合して社長に復帰",p:1,b:"東証マザーズ、東証一部と上場を重ね、2017年に元の会社と経営統合して持株会社の社長CEOに戻った。一度手放した場所に、自分で作った事業を持って帰ってきた形。"},
  {y:"現在",t:"社長を100人公募するという構想",b:"売上100億円の会社を100社作る、という発想でグループを設計している。トライアスロンの日本代表選考、モンブランやキリマンジャロの登頂といった記録も持つ。"}],
 rules:[
  {h:"借りたものは返す。仲間は見捨てない",s:"巨額の負債と金融機関との対立をくぐる中で、この2つの原則が意思決定を支えたとされる。商売人としての倫理を、複雑な局面での判断基準に据えている。",u:"⭐️判断基準は少ないほうが強い。制度が変わっても揺れないルールを、2つに絞って書き出す。縁道もそのくらいの粒度まで削れる。"},
  {h:"負の遺産の処理と、未来への投資を同時にやる",s:"継いだ時点でケーブル網は違法状態だった。それを正す作業を進めながら、同じ設備に光ファイバーを張り合わせていくという判断をしている。片づけてから始めるのでは間に合わない、という時間感覚。",u:"技能実習の是正対応と、育成就労への移行準備。順番にやると間に合わない。同じ工事として設計する。"},

  {h:"降りたあと、規模の小さい場所へ自分から戻る",s:"1000億円超の損失で上場企業の社長を退いた後、切り出した1事業の社長として47歳で再出発している。プライドではなく、やれる場所を選んだ。",u:"⭐️失敗した後の身の置き方。肩書きを守ろうとすると、動ける場所がなくなる。"},

 since:1989, sector:"人材／スポーツ／投資", gen:"第1世代", accent:"#8C2F39", x:70, y:60, status:"filled",
 essay:"「業種は関係ない」の最強の証拠。<b>38勝97敗1分という最下位の成績で、球団を初年度黒字化した。</b>当時のリーグ各球団は毎年20〜40億円規模の赤字が常態化していた中で、である。\n⭐️を付けたのは、参入の背景に「赤字を理由に球団が消滅したばかり」という事情があり、だから至上命題を黒字化に置いたこと。前任者が何で死んだかを見て、自分の最優先課題を決めている。監理団体の許可取消や廃業事例には、成功事例より多くの情報がある。",
 thesis:"経営の本質を見極めれば、業種は無関係。人材サービスの経営者が、球団を初年度で黒字にした。",

 pivots:[
  {y:"1987",t:"リクルートに入り、営業で全国トップになる",p:1,b:"自ら機会を創り出し、機会によって自らを変えよ——新入社員時代に叩き込まれたこの社是を、いまも軸にしていると語る。"},
  {y:"1989",t:"入社2年目に出会った仲間と、24歳で起業する",p:1,b:"1000人で1000億円の会社を目指して人材サービス会社を共同創業。当時はベンチャーキャピタルという言葉すらなく、銀行は創業間もない会社に融資しなかった。夢を持って起業したものの、まず食べるための金を稼ぐ必要があった時代。"},

  {y:"2004",t:"50年ぶりの新球団を、4か月で立ち上げる",p:1,b:"参入決定から開幕まで約4か月。選手ゼロ、試合開催の経験ゼロ、球場も未完成という状態からの立ち上げだった。前年に球界再編が起き、赤字が理由で球団が消滅したばかりという背景がある。"},
  {y:"2005",t:"38勝97敗1分。それでも初年度に黒字化する",p:1,b:"当時のリーグ各球団は毎年20〜40億円規模の赤字が常態化していた。至上命題は黒字化と健全な球団経営で、成績が最下位でも経営としては成立させた。経済界の常識は野球界にも通用するはず、という信念のもとで球界の常識を次々に変えている。"},
  {y:"2008〜",t:"オーナー職を譲り受け、その後グループ全体の経営へ",b:"球団での手腕を評価され、親会社のマーケティングやグローバル展開の舵取りを任される。"},
  {y:"2016〜",t:"投資家として、300社以上を支援する",p:1,b:"自分の起業経験と球団経営の検証を、投資先へのアドバイスに使っている。"}],
 rules:[
  {h:"経営の本質が同じなら、業種は関係ない",s:"経済界での常識は野球界にも通用するはず、という信念で球団経営に入り、赤字が常態化していた業界で初年度黒字を達成した。業界の特殊性を、経営原則を適用しない理由にしていない。",u:"⭐️小泉文明と同じ結論。監理団体は特殊だから、という言葉が出たら、その特殊性が本当に経営原則を無効にするのか検証する。ほとんどの場合、しない。"},
  {h:"成績と経営を、切り離して評価する",s:"38勝97敗という最下位の成績で、経営としては黒字にしている。現場の勝敗と、事業の健全性を別の帳簿で管理した。",u:"実習生の受入数や成長率が伸びない年でも、経営の健全性は別に守れる。2つを混同すると、無理な受注に走る。"},
  {h:"準備期間がなくても、始める",s:"参入決定から開幕まで約4か月。選手も球場も経験もない状態で立ち上げている。整うのを待たない、という判断。",u:"2027年の制度移行も、準備が整ってから動くのでは間に合わない。不完全なまま始めて、走りながら整える。"},

  {h:"消滅した先例から、至上命題を引き出す",s:"赤字を理由に球団が消えたばかりという状況で参入した。だから最優先課題を黒字化と健全経営に置いている。前任者が何で死んだかを見て、自分の目標を決めた。",u:"⭐️監理団体の許可取消や廃業事例を集めて、そこから自社の最優先課題を決める。成功事例より、消えた理由のほうが情報量が多い。"}],

  {y:"2013",t:"上場後初の四半期赤字。37歳で社長を降りる",p:1,b:"業績不振で株価も下がる中、代表取締役社長から代表権のない会長に退いた。創業者が、まだ40歳前に自ら退いている。"},
  {y:"2013〜15",t:"降りた後に、2つの新しい柱を作る",p:1,b:"同時期にゲームが大ヒットし会社を立て直す。さらに本人は2015年、家族向けの写真共有サービスを立ち上げ、会長でありながら自ら宣伝活動に汗をかいていた。国内の親の多数が使うサービスに育っている。"},

  {h:"降りた後に、自分で小さいものを立ち上げ直す",s:"会長という立場でありながら、新サービスの宣伝に自ら汗をかいていた。役職の高さと、やることの泥臭さを切り離している。",u:"宇野康秀と同じ型。役職が上がっても、小さく始める作業を自分の手で持つ。"},
  {h:"同じ主題に、20年後にもう一度挑む",s:"SNSで頂点と凋落を経験した本人が、20年後に再びSNSを作っている。一度負けた領域から撤退していない。",u:"領域を変えないという点で古川健介と同じ。手段は変えても、テーマは変えない。"},
  {h:"流行の逆を、居心地で選ぶ",s:"巨大SNSがレコメンド重視になっていることに寂しさを感じる、という理由から新しいサービスを設計している。市場のトレンドではなく、失われた体験を基準にしている。",u:"業界の効率化競争の逆側に、あなたの縁道がある。トレンドではなく、失われたものを基準にする選び方。"},

 essay:"⭐️は「業界そのものへの批判」という谷の型。<b>自社の不祥事ではなく、ソーシャルゲーム市場に対する社会からの批判という形で逆風が来た。</b>個社の努力では防げない種類のもので、技能実習制度への批判とまったく同じ構造だ。\nあなたの会社の運用がどれだけ適正でも降りかかる。防げない前提で、説明を先に用意しておくべき類型になる。出発点が個人の趣味だったことも面白い。公開1か月で会員1万人を突破し、それが会社になった。ARCANAと同じ入り方だ。",

 essay:"⭐️は「起業家経済という単位で考える」。<b>いまのビジネスの構成だけでは経済は永遠にもたない、新陳代謝が必要だ、古いものは外に出して上場企業は常に入れ替わるべきだ</b>——個社ではなく経済の代謝を単位にしている。\n監理団体3200社の業界も、代謝が止まれば沈む。監理ナビを1社の効率化ツールではなく、業界の代謝を上げる装置と位置づけ直せる。渋谷に名前を与えて人を集めた手法は、山本七平の「空気に名前を与える」とちょうど裏表の関係にある。",

  {y:"1990年代後半",t:"世界最大級のネット企業の日本法人立ち上げに参加",b:"その経験と人脈が、次の事業の基盤になった。"},
  {y:"1998",t:"日本初の業態として、ネットビジネスのインキュベーターを創業",p:1,b:"自分で1つの事業をやるのではなく、事業を生み出す装置を作った。当時この業態は日本に存在しなかった。"},
  {y:"1999",t:"渋谷を「ビットバレー」と名づけ、構想を宣言する",p:1,b:"言葉を作り、場所に名前をつけ、人が集まる理由を用意した。ここから日本のネット企業の多くが世に出ている。当時を知る人は、ネットエイジとデジタルガレージ、そしてソフトバンクの3つが産業の母体だったと証言している。"},

  {h:"場所に、名前をつける",s:"渋谷という地域に言葉を与えたことが、コミュニティ形成の起点になった。人を集める前に、集まる理由となる名前を用意している。",u:"あなたが作りたい業界の集まりにも、名前が要る。名前がないものには人は集まらない。山本七平の「空気に名前を与える」と裏表の関係。"},
  {h:"1社ではなく、生み出す装置を作る",s:"日本に存在しなかったインキュベーターという業態を、自分で作った。事業を作るのではなく、事業が生まれる仕組みを作る側に立っている。",u:"堀義人・重松大輔と同じ系譜。育成した人材が各所で活躍する構造そのものが、長期の資産になる。"},
  {h:"新しさは、ゼロから作られるべきだと考える",s:"親会社が大企業という上場企業は面白くない、まったくのゼロからフレッシュなコンセプトを生み出した企業が上場すべきだ、という立場を明確にしている。",u:"既存の枠組みの延長ではなく、ゼロから設計したものを出す。監理ナビはその条件を満たしているか。"},
  {h:"熱狂の後に来る崩壊を、経験として持つ",s:"ブームの中心にいて、その崩壊も受けている。そのうえで、堅実な経営をしていた企業はその後に成長した、と総括している。熱狂と実力を分けて見る目を持った。",u:"AIブームの中で同じことが起きる。熱狂に乗るのは構わないが、熱狂が消えた後に残るものを持っているか。"},

  {h:"ないものを嘆かず、あるものを組み合わせる",s:"エンジニアがいないなら、副業の技術者を束ねる。フルタイムで雇えないなら、夜と週末を集める。制約を、体制設計の条件として扱っている。",u:"⭐️6人の組織でも同じ。フルタイムで採れないなら、副業・業務委託・インドネシア側の人員を組み合わせる。監理ナビの開発体制はこの型で組める。"},
  {h:"最初で最後の勝負を、はっきり決める",s:"別事業の売却益を、これは恵みのボーナスだとしてテレビCMに全額投じた。日常的に賭けるのではなく、ここという一度だけに集中させている。",u:"藤田晋の押し引きと同じ。普段は引き、勝負所で全部を張る。その一度を、自分で定義しておく。"},
  {h:"強烈な経営者の近くで、直接見る",s:"新球団の立ち上げで、3人の経営者の行動と言動を間近で見た経験が大きな影響を与えたと語る。本や講演ではなく、同じ現場にいたこと自体を学習と捉えている。",u:"このアーカイブの限界でもある。記録から学べることには上限があり、実際に近くで見る機会には代えられない。"},
  {h:"人の次に、資本を流動化させる",s:"人材の流動化に取り組んだ後、資本の流動化にも着目してM&Aのマッチング事業を立ち上げている。同じ構造の課題を、別の対象で解いている。",u:"監理という人の流動を扱っているなら、その隣にある資金・情報・技能の流動にも同じ仕組みが使える。"},
  {h:"変化が来る前に、体制を変える",s:"必ず到来する社会変化への準備としてグループ経営体制へ移行し、それがコロナ禍と重なったのは偶然だと述べている。事象に反応したのではなく、先に構えていた。",u:"2027年に反応するのではなく、いま体制を変えておく。変化が来たときには、すでに終わっている状態を作る。"}],

 since:1978, sector:"小売・ディスカウント", gen:"第0世代", accent:"#0B4F8A", x:86, y:70, status:"filled",
 essay:"⭐️が2つとも、あなたの弱点に直撃する。<b>1号店の開業後、現場への直接指導を「教える」から「自分でやらせる」へ転換し、店舗運営の大半を売場担当者に委ねた。</b>判断をあなたに上げさせている限り、6人が6人分の力にならない。\nもうひとつは「他の大手小売企業の真似は絶対にしない」。原点の逸話も良い。深夜に荷解きしていると飲み会帰りの客に「それ、買える？」と声をかけられ、そこから深夜営業に行き着いた。統計ではなく、目の前の1人の行動から業態が決まっている。",

 pivots:[
  {y:"1973〜78",t:"就職先が10か月で倒産し、どん底の日々を送る",p:1,b:"大学を出て入った不動産会社が短期間で倒産。麻雀やパチンコで食いつなぐ時期を経て、29歳で一念発起している。順風な出発ではまったくなかった。"},
  {y:"1978",t:"18坪の店を、たった1人で始める",p:1,b:"商品は売れず、仕入先には騙され、1人で思い悩む日々が続いた。ここから26年以上の連続増収増益が始まるとは、本人も思っていなかったはず。"},
  {y:"創業直後",t:"深夜に、酔ったサラリーマンから声をかけられる",p:1,b:"遅くまで商品を荷解きしていると、飲み会帰りの客に「それ、買える？」と言われた。観察すると、都市部には夜型の生活者が多く、深夜にこそ売る機会があると気づく。これがドン・キホーテの原点になった。<b>顧客の行動を観察して、業界の営業時間の常識を捨てた瞬間。</b>"},
  {y:"1980〜89",t:"会社を設立し、1号店を開く",b:"現金問屋を経て、1989年に東京・府中で1号店。"},
  {y:"1号店以降",t:"教えることをやめて、やらせることに切り替える",p:1,b:"創業者が現場を直接指導する方式から、店舗運営の大半を売場担当者に委ねる方式へ転換した。権限委譲と現場主義を「主権在現」という言葉で制度化している。チェーンストア理論の逆張り。"},
  {y:"1996〜2000",t:"店頭公開、東証二部、そして一部へ"},
  {y:"2007〜19",t:"経営難の同業を次々に取り込む",b:"債務超過だった総合スーパーを子会社化し、大型店の業態へ転換。のちに大手小売グループも完全子会社化している。"},
  {y:"2015",t:"66歳で日本を離れ、ゼロから新業態を作る",p:1,b:"会長兼CEOを退任してシンガポールへ移住。日本産品に特化した新しい店をゼロから立ち上げた。国内で頂点に立った後、海外で無名の状態から始め直している。"}],
 rules:[
  {h:"大手の真似は、絶対にしない",s:"他の大手小売企業の真似は絶対にしない、という逆張り発想を貫き通したことが、創業の精神として公式に記録されている。凡庸は楽だが即死を意味する、という言い方もしている。",u:"⭐️監理団体の横並びは、そのまま価格競争になる。同業と同じことをしている項目を洗い出して、1つずつ潰す。"},
  {h:"権限を、現場に渡し切る",s:"教えるからやらせるへ転換し、店舗運営の大半を売場担当者に委ねた。仕入れも陳列も価格も現場が決める。だから店ごとに顔が違い、他社が真似できない。",u:"⭐️あなたの弱点に直撃する。監理担当者に、どこまでを自分で決めさせているか。判断をあなたに上げさせている限り、6人が6人分の力にならない。"},
  {h:"店は作品、主役は現場の人間",s:"店を作品と捉え、店員を主役に置いている。経営者が主役の会社ではなく、現場が主役の会社として設計した。",u:"社長が前に出る組織か、担当者が前に出る組織か。後者のほうが、顧客の満足度も採用の質も上がる。"},
  {h:"顧客の行動を観察して、業界の常識を捨てる",s:"深夜に声をかけられた一件から、夜型生活者の存在に気づき、深夜営業という当時の非常識を選んだ。統計ではなく、目の前の一人の行動から始まっている。",u:"実習生や受入企業の「そんな時間に？」という行動の中に、次のサービスがある。1件の観察を軽視しない。"},
  {h:"はらわたで考える",s:"難題に直面するたびに逆張りの視点を突き詰め、はらわたで考えなければ真のブレークスルーは生まれない、と述べている。社員にも同じことを求めた。",u:"⚠️精神論に聞こえるが、意味は「他人の枠組みで考えるな」ということ。フレームワークを当てはめる前に、自分の言葉で問題を言い直す。"},
  {h:"orではなくandを目指す",s:"安さと品質、効率と個性。二者択一に見えるものを両立させにいく発想を掲げている。",u:"平尾丈の別解、大谷翔平の二刀流と同じ構造。監理の質と価格、規模と丁寧さ。andの形を探す。"},
  {h:"頂点に立ってから、無名の場所で始め直す",s:"66歳で日本を離れ、海外でゼロから新業態を立ち上げた。国内で築いた地位を持ち込まず、現地では新規参入者として始めている。",u:"インドネシアでの展開も同じ構造。日本での実績が通用しない場所で、もう一度ゼロから作る覚悟があるか。"}],

{
 id:"shigeta", name:"重田 康光", roma:"SHIGETA YASUMITSU",
 ctype:"創業", born:1965,
 role:"光通信 代表取締役会長兼CEO", company:"光通信", domain:"経営",
 since:1988, sector:"通信・法人向けサービス", gen:"第1世代", accent:"#7A6C4F", x:90, y:64, status:"filled",
 essay:"永守重信と完全に同じ構造の谷。<b>現場が厳しいノルマを達成するために架空契約に手を出し、下方修正の翌日から20営業日連続ストップ安。24万円だった株価は3600円台まで落ちた。下落率は約99%。</b>\n制度が悪用されたのではなく、達成できない目標が悪用を生んだ。監理ナビのARR目標も受入人数の目標も同じ危険を持つ。そして復活の仕方が示唆的で、投資銘柄ではなく事業会社として着実に利益を積む方向へ、評価の源泉そのものを入れ替えている。",
 thesis:"20営業日連続ストップ安、株価は99%下落。それでも会社を手放さず、20年以上かけて別の収益構造に組み替えた。",
 spec:[["BORN","1965年生まれ"],["FOUNDED","1988年2月・光通信"],["IPO","1996年・31歳で当時史上最年少の店頭公開"],["PEAK","1999年 フォーブス長者番付 世界5位"],["CRASH","2000年 20営業日連続ストップ安"],["NOW","会長兼CEOとして現役"]],
 pivots:[
  {y:"1988",t:"23歳で創業。通信の取次代理店から始める",b:"のちに主戦場を携帯電話の販売へ移し、急成長する。"},
  {y:"1996〜99",t:"31歳で店頭公開、34歳で東証一部。いずれも当時の史上最年少",p:1,b:"1999年には米経済誌の長者番付で世界5位に。IT相場の象徴的存在になり、大手通信企業の社外取締役にも就任している。"},
  {y:"2000年3月",t:"「寝かせ」が報じられる",p:1,b:"販売奨励金を受け取るために架空契約を行っていたとされる問題が月刊誌で報じられた。現場の厳しい目標が背景にあったとされ、契約だけ結んで端末を寝かせ、一定期間後に解約するという手法だった。<b>目標設定が現場を歪めた典型例。</b>"},
  {y:"2000年3月30日",t:"下方修正。翌日から20営業日連続ストップ安",p:1,b:"従来予想の黒字から一転して赤字に。最高値24万1000円だった株価は3600円台まで落ちた。下落率は約99%。日本のITバブル崩壊の引き金とも言われる。"},
  {y:"2002",t:"株価は895円まで下がる",p:1,b:"底はさらに深かった。ここまで落ちて残った経営者は、このアーカイブでも例がない。"},
  {y:"2003〜",t:"投資銘柄ではなく、事業会社として作り直す",p:1,b:"ベンチャー投資の会社ではなく、通常の事業会社として着実に利益を積む方向へ転換した。法人向けの継続課金型サービスへ主力を移し、収益構造そのものを組み替えている。"},
  {y:"現在",t:"会長兼CEOとして、なお経営の第一線に",b:"創業から35年以上。頂点も底も経験したうえで、同じ会社を率い続けている。"}],
 rules:[
  {h:"⚠️過大な目標は、現場に数字を作らせる",s:"架空契約の背景には、現場に課された厳しい目標があったとされる。制度が悪用されたのではなく、達成できない目標が悪用を生む構造だった。",u:"⭐️永守重信の事例と完全に同じ構造。監理ナビのARR目標も、受入人数の目標も同じ危険を持つ。未達を報告できる場を先に作らないと、数字は必ず作られる。"},
  {h:"⚠️熱狂の頂点は、崩壊の直前である",s:"長者番付で世界5位に載った、まさにその直後に問題が発覚している。外部からの評価が最高潮のときに、内部では最も無理が積み上がっていた。",u:"⚠️表彰や認定を受けた期こそ、現場の無理を点検する。池内計司も同じ年に頂点と民事再生を経験している。"},
  {h:"落ちても、会社を手放さない",s:"株価が99%下落し、さらにその後も下げ続けた局面でも経営から離れなかった。売却も撤退も選ばず、同じ会社で作り直している。",u:"宇野康秀は事業を切り出して再起し、この人は本体に残った。どちらも成立する。重要なのは、逃げる先を先に決めておかないこと。"},
  {h:"投資会社ではなく、事業会社に戻る",s:"バブル期の高い評価は投資銘柄としてのものだった。崩壊後は、通常の事業会社として着実に利益を計上する方向へ転換している。評価の源泉そのものを入れ替えた。",u:"⭐️あなたの会社の評価は、いま何で決まっているか。話題性か、実際の利益か。前者に寄っているなら、後者へ寄せ直す時期。"},
  {h:"継続課金の構造へ、主力を移す",s:"一度売って終わる商売から、法人向けに継続的に課金する構造へ組み替えた。景気や相場に左右されにくい収益基盤を作っている。",u:"監理費は既に継続課金型。その強みを自覚して、単発の紹介収入に依存しない設計を保つ。"},
  {h:"かつての評価には、二度と戻らない前提で経営する",s:"株価は回復したものの、バブル期の水準に迫ることはできていない。過去の最高値を目標にせず、別の基準で経営を続けている。",u:"最も良かった時期の数字を目標に置き続けると、判断を誤る。基準は現在の構造に合わせて引き直す。"}],

const mem={};
const store={
  async get(k){ try{ if(window.storage){const r=await window.storage.get(k); return r&&r.value;} }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){} return mem[k]||null; },

function delabelOverlaps(){
  const box=document.getElementById("mx"); if(!box) return;
  const dots=[...box.querySelectorAll(".dot")];
  dots.forEach(d=>{ d.classList.remove("up","hidelabel"); });
  // 上下に振り分け：同じ縦位置に近いものは交互に上へ
  const placed=[];
  const inter=(a,b)=>!(a.right<b.left-2||a.left>b.right+2||a.bottom<b.top-1||a.top>b.bottom+1);
  // 収録済みを優先して配置（stubは後回し＝重なったら消える）
  const order=dots.slice().sort((a,b)=>{
    const sa=a.classList.contains("stub")?1:0, sb=b.classList.contains("stub")?1:0;
    if(sa!==sb) return sa-sb;
    return a.getBoundingClientRect().top-b.getBoundingClientRect().top;
  });
  order.forEach(d=>{
    const sp=d.querySelector("span"); if(!sp) return;
    let r=sp.getBoundingClientRect();
    if(placed.some(q=>inter(r,q))){
      d.classList.add("up");
      r=sp.getBoundingClientRect();
      if(placed.some(q=>inter(r,q))){ d.classList.add("hidelabel"); return; }
    }
    placed.push(sp.getBoundingClientRect());
  });
}

      '<button data-a="q3">落ちた</button>'+

      '<button data-a="A">自分たちの判断や拡大の仕方</button>'+

  } else if(stuckStep===3){

      '<button data-a="D">そもそも誰にも評価されていない。反応がない</button></div></div>';
  }
  html+='</section>';
  app.innerHTML=html;
  document.querySelectorAll(".step button").forEach(b=>b.addEventListener("click",()=>{
    const a=b.dataset.a;
    if(a==="next") stuckStep=1;

  }));

}

const LOGKEY="method:log:v1";
let LOG=null;
function dkey(d){d=d||new Date();const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function dshift(n){const d=new Date();d.setDate(d.getDate()+n);return d;}
async function loadLog(){ if(LOG) return LOG; try{const v=await store.get(LOGKEY); LOG=v?JSON.parse(v):{};}catch(e){LOG={};} if(!LOG||typeof LOG!=="object")LOG={}; return LOG; }
async function saveLog(){ try{ await store.set(LOGKEY, JSON.stringify(LOG)); }catch(e){} try{ schedulePush(); }catch(e){} }

async function initGenericDaily(kind, UNITS, color){
  const log=await loadLog(); const k=dkey();
  let st=(log[k]&&log[k][kind])||[];
  if(!Array.isArray(st)||st.length!==UNITS.length) st=new Array(UNITS.length).fill(0);
  const box=$("#units"),num=$("#gnum");
  function persist(){ log[k]=log[k]||{}; log[k][kind]=st.slice(); log[k].t=Date.now(); saveLog(); }
  function draw(){
    box.innerHTML="";
    UNITS.forEach((u,i)=>{
      const el=document.createElement("div");
      el.className="unit"+(st[i]?" on":"");
      el.tabIndex=0; el.setAttribute("role","checkbox"); el.setAttribute("aria-checked",st[i]?"true":"false");
      el.innerHTML='<span class="led" style="'+(st[i]?"background:"+color:"")+'"></span><span class="txt">'+esc(u[0])+'<small>'+esc(u[1])+'</small></span>';
      const t=()=>{st[i]=st[i]?0:1;draw();persist();};
      el.addEventListener("click",t);
      el.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();t();}});
      box.appendChild(el);
    });
    num.innerHTML=Math.round(st.filter(Boolean).length/st.length*100)+'<small>%</small>';

}

/* ===== クラウド同期（GAS + スプレッドシート） ===== */
const SYNCKEY="method:sync:v1";
let SYNC={url:"",user:""}, syncLoaded=false, pushTimer=null, pulledThisSession=false;
async function loadSync(){ if(syncLoaded) return SYNC;
  try{ const v=await store.get(SYNCKEY); if(v){ const o=JSON.parse(v); SYNC.url=o.url||""; SYNC.user=o.user||""; } }catch(e){}
  syncLoaded=true; return SYNC; }
async function saveSync(){ try{ await store.set(SYNCKEY, JSON.stringify(SYNC)); }catch(e){} }

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="mjcb"+Date.now()+Math.floor(Math.random()*1000);
    const sc=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();rej(new Error("timeout"));},15000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; if(sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb]=d=>{ cleanup(); res(d); };
    sc.onerror=()=>{ cleanup(); rej(new Error("network")); };
    sc.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+cb;
    document.head.appendChild(sc);
  });
}
async function pullRemote(){
  if(!SYNC.url) throw new Error("URL未設定");
  const d=await jsonp(SYNC.url+"?action=load&user="+encodeURIComponent(SYNC.user||"default"));
  if(!d||!d.ok) throw new Error((d&&d.error)||"読み込み失敗");
  return d.log||{};
}
async function pushRemote(log){
  if(!SYNC.url) throw new Error("URL未設定");
  const r=await fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"save",user:SYNC.user||"default",log:log})});
  const d=await r.json();
  if(!d||!d.ok) throw new Error((d&&d.error)||"保存失敗");
  return d;
}
function mergeLog(a,b){
  const out={};
  Object.keys(a||{}).forEach(k=>out[k]=Object.assign({},a[k]));
  Object.keys(b||{}).forEach(k=>{
    const rem=b[k], loc=out[k];
    if(!loc){ out[k]=Object.assign({},rem); return; }
    if((rem.t||0)>(loc.t||0)) out[k]=Object.assign({},loc,rem);
  });
  return out;
}
async function syncNow(silent){
  await loadSync();
  if(!SYNC.url) return {ok:false,msg:"URLが未設定です"};
  try{
    const local=await loadLog();
    const remote=await pullRemote();
    LOG=mergeLog(local,remote);
    await saveLog();
    await pushRemote(LOG);
    pulledThisSession=true;
    return {ok:true,msg:"同期しました（"+Object.keys(LOG).length+"日分）"};
  }catch(e){ return {ok:false,msg:"同期できませんでした："+e.message}; }
}
function schedulePush(){
  if(!SYNC.url) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ pushRemote(LOG).catch(()=>{}); }, 4000);
}

  '<p class="lead" style="margin:6px 0 10px">値下げそのものは縁道に反しない。<b>値下げの負担を実習生や送り出し校に転嫁したら反する。</b>だから削らないものを先に決める。松下幸之助の1929年と同じ順序。</p>'+
  ENDO_LINES.map((l,i)=>'<div class="choice"><div class="aa">'+(i+1)+'. '+esc(l.t)+'</div><div class="qq" style="margin-top:3px">'+l.d+'</div></div>').join("")+
  chips(["matsushita","tsukakoshi"])+'</div>'+

  '<div class="layer" style="border-left-color:#B08A2E"><div class="no">LAYER 5 ／ METRICS</div><span class="st draft">運用中・要検証</span><h4>指標 ── 数字にならない価値を測る</h4>'+
  '<p>小林喜光のKAITEKI経営に倣い、財務指標の隣に置く。現行体制の上限は1人24名（実測と理論値が一致）。目標上限は1人40名だが、<b>到達条件を満たしたときのみ引き上げる。</b></p></div>'+

  '<div class="sec2"><span>CALCULATOR</span>受入可能総数の計算</div>'+
  '<p class="lead" style="margin-top:10px">宣言した上限から、受けられる案件量が自動的に決まります。感覚ではなく計算で受注判断をするための計器です。</p>'+
  '<div class="calc">'+
  '<div class="row3"><label>監理担当者の人数<small>営業・事務専任は含めない</small></label><input id="e_staff" type="number" inputmode="numeric" value="3"></div>'+
  '<div class="row3"><label>1人あたりの上限<small>現行24／到達条件を満たせば40</small></label><input id="e_cap" type="number" inputmode="numeric" value="24"></div>'+
  '<div class="row3"><label>現在の管理人数<small>実習生・育成就労者の合計</small></label><input id="e_now" type="number" inputmode="numeric" value="72"></div>'+
  '<div class="out"><div><dt>受入可能総数</dt><dd id="e_total">—</dd></div><div><dt>稼働率</dt><dd id="e_rate">—<small>%</small></dd></div></div>'+
  '<div class="verdict" id="e_verdict">—</div></div>'+

  '<div class="stubnote" style="margin-bottom:20px"><b>⚠️多国籍化は、1人あたり上限を下げる方向に働く。</b>2026年9月からパキスタン受入が始まる。言語も文化も宗教上の配慮も別系統になるため、同じ人数でも1件あたりの所要時間は増える。インドネシア単一だった前提での24名を、そのまま複数国籍に適用しない。<br><br>最初の3か月は<b>実測を取ること自体を目的にする。</b>国籍別に1件あたりの所要時間を記録すれば、上限を感覚ではなく数字で引き直せる。</div>'+
  '<div class="sec2"><span>CONDITION</span>上限を40名へ引き上げる条件</div>'+
  '<p class="lead" style="margin-top:10px">この3つが揃わない限り、40名は掲げない。⚠️そして木下勝寿の警告どおり、「1人40名」を単独で掲げてはいけない。訪問と即時対応をセットで掲げないと、優秀な人ほど訪問を削って達成しようとする。</p>'+
  '<div class="tt">'+
  '<div class="row2"><div class="tm">訪問</div><div class="ct">1件あたり 3時間 → 2時間<small>オンライン面談で移動時間を削る。準備と記録をARCANAで自動化する。</small></div></div>'+
  '<div class="row2"><div class="tm">事務</div><div class="ct">1人あたり月1時間 → 0.5時間<small>申請と帳票の自動生成。</small></div></div>'+
  '<div class="row2"><div class="tm">相談</div><div class="ct">全件を人が対応 → 7割を自己解決<small>多言語FAQと一次受けの自動化。人が出るのは判断が要るものだけ。</small></div></div>'+
  '</div>'+
  '<div class="stubnote" style="margin-bottom:20px"><b>これが監理ナビの存在理由そのもの。</b>単なる業務効率化ツールではなく、縁道の防衛線を守ったまま規模を伸ばすための装置。1人24名を40名にできれば、600名に必要な監理担当者は25人から15人になる。年3人ペースの採用で届く。<br><br><b>理念とプロダクトが、ここで一本につながる。</b></div>'+

  '<div class="sec2"><span>BROKEN</span>縁道が破れている状態</div>'+
  '<p class="lead" style="margin-top:10px">守れているかを測るより、<b>破れているかを検知するほうが運用しやすい。</b>1つでも当てはまったら、縁道に反している。月に一度、この8項目を点検する。</p>'+
  '<div class="brk"><ul>'+ENDO_BREAK.map(b=>'<li>'+esc(b)+'</li>').join("")+'</ul></div>'+

  '<div class="sec2"><span>NOTE</span>この仕様書について</div>'+
  '<div class="disclaimer">ここに書かれた数字と条件は、2026年8月時点の対話から導いたものです。確定ではなく<b>いまの最善</b>であり、体制と技術が変われば書き直す前提で運用してください。<br><br>とくに1人あたり上限は、オンライン面談の実運用が始まれば実測値で更新できます。<b>感覚ではなく実測で更新する</b>こと自体が、桜井博志・村田吉弘・米田肇が到達した「職人の勘を数値化する」の実践になります。</div>'+
  '</section>';
  document.querySelectorAll(".ev button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.id)));
  const calc=()=>{
    const st=+($("#e_staff").value||0), cap=+($("#e_cap").value||0), now=+($("#e_now").value||0);
    const total=st*cap;
    $("#e_total").textContent = total||"—";
    const rate = total? Math.round(now/total*100) : 0;
    $("#e_rate").innerHTML = (total?rate:"—")+'<small>%</small>';
    const v=$("#e_verdict");
    const left=total-now;
    if(!total){ v.className="verdict"; v.textContent="—"; return; }
    if(rate>100){ v.className="verdict ng";
      v.innerHTML="<b>上限超過。</b>いま防衛線の外側にいます。"+(now-total)+"名分の余力が不足。受注を止めて増員するか、上限引き上げの条件を先に満たしてください。崩れるのは、いつも弱い側に近いほうです。"; }
    else if(rate>=90){ v.className="verdict warn";
      v.innerHTML="<b>ほぼ満杯。</b>受入余地は残り"+left+"名。<b>採用が先、受注が後。</b>次の1人を採る前に、次の案件を取らない。"; }
    else { v.className="verdict";
      v.innerHTML="余力あり。あと<b>"+left+"名</b>まで、防衛線を守ったまま受けられます。"; }
  };
  ["e_staff","e_cap","e_now"].forEach(id=>$("#"+id).addEventListener("input",calc));
  calc();
}

function renderToday(){
  const pool=[]; filled.forEach(p=>p.prompts.forEach(q=>pool.push({p,q})));
  const seed=new Date().toDateString().split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const pick=pool[seed%pool.length];
  app.innerHTML='<section class="view"><div class="hd"><span class="tag">TODAY</span><h2>今日のモード</h2></div>'+
   '<p class="lead">なりきるとは口調を真似ることではなく、同じ問いを自分に投げること。日付で1問が固定されます。</p>'+
   '<div class="today"><div class="who">'+esc(pick.p.name)+' ／ '+esc(pick.q[0])+'</div>'+
   '<div class="qq">'+esc(pick.q[1])+'</div>'+
   '<div class="frm">'+esc(pick.p.thesis)+'</div>'+
   '<button class="btn" id="shuffle">別の問いを引く</button> <button class="btn" id="goto" style="background:#5B6560">この人を開く</button></div></section>';
  $("#shuffle").addEventListener("click",()=>{const r=pool[Math.floor(Math.random()*pool.length)];
    $(".today .who").textContent=r.p.name+" ／ "+r.q[0]; $(".today .qq").textContent=r.q[1]; $(".today .frm").textContent=r.p.thesis;
    $("#goto").dataset.id=r.p.id;});
  $("#goto").dataset.id=pick.p.id;
  $("#goto").addEventListener("click",e=>go(e.target.dataset.id));
}

function renderCompare(){
  const sel=cmp.map(id=>filled.find(p=>p.id===id)).filter(Boolean);
  app.innerHTML='<section class="view"><div class="hd"><span class="tag">COMPARE</span><h2>並べて選ぶ</h2></div>'+
   '<p class="lead">2人まで選択。同じ局面でも処方が違うので、いまの自分の課題に近い方を採用します。</p>'+
   '<div class="picker">'+filled.map(p=>'<button data-id="'+p.id+'" class="'+(cmp.includes(p.id)?"on":"")+'">'+esc(p.name)+'</button>').join("")+'</div>'+
   (sel.length?'<div class="cmp">'+sel.map(p=>'<div class="col"><h4>'+esc(p.name)+'</h4><div class="th">'+esc(p.thesis)+'</div>'+
     '<ol>'+p.rules.map(r=>'<li>'+esc(r.h)+'</li>').join("")+'</ol>'+
     '<div class="th" style="border:none;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)"><b>失敗時の初手：</b>'+esc(p.fail.items[0].b)+'</div></div>').join("")+'</div>'
    :'<div class="stubnote">上から2人選んでください。</div>')+'</section>';
  document.querySelectorAll(".picker button").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.id;
    if(cmp.includes(id)) cmp=cmp.filter(x=>x!==id); else { cmp.push(id); if(cmp.length>2) cmp.shift(); }
    renderCompare();
  }));
}

  '<div class="disclaimer">収録はすべて<b>公開インタビュー・本人の発信・公式資料にもとづく事実と要約</b>で構成します。本人が言っていない発言の創作や、なりすました台詞は載せません。模倣の対象は判断の型と習慣であって、人格や資産ではありません。</div>'+
  '<div class="stubnote"><b>収録の条件（改訂版）</b><br>① 判断の型が10年以上にわたって一貫して観察できる<br>② 一次資料がある。本人の著作・発言・同時代の記録・研究のいずれか<br>③ 谷か、強い制約がある。順風だけの記録は真似できない<br>④ 分野は問わない。経営／老舗・職人／思想・学問／表現／競技／歴史<br><br>③ が最重要です。成功譚しか残っていない人は、真似できる粒度の情報がないため収録しません。<br><br><b>存命でない人・歴史上の人物の扱い</b><br>後世の脚色と史料の区別がつかない逸話は、判断ルールに使いません。「◯◯はこう言ったとされる」は不採用。本人の著作、同時代の記録、研究で確認できる<b>行動</b>だけを扱います。出典欄には、それが本人の言葉か、後世の評価かを明記します。<br><br><b>危険な型は、危険と書く</b><br>真似すべきでない型（懸念の一蹴、放任、現代の労働法制に合わない育成手法など）には⚠️を付けています。図鑑の役割は推奨ではなく、選べる状態にすることです。<br><br>'+  '<b>1人分に必要な4点セット</b><br>1. 分岐点3つ（何をやめたか／何を売らなかったか）<br>2. 繰り返し語っている判断ルール5〜6<br>3. 失敗と回復の手順<br>4. 生活の制約（睡眠・予定・機嫌・情報源）<br><br>'+

}

async function initDaily(p){
  const KEY="method:"+p.id+":"+new Date().toDateString();
  const pp = p.dailyMode==="pushpull";
  let st = new Array(p.daily.length).fill(0);
  const saved = await store.get(KEY);
  if(saved){ try{ const v=JSON.parse(saved); if(Array.isArray(v)&&v.length===st.length) st=v; }catch(e){} }
  const box=$("#units"), num=$("#gnum");
  function draw(){
    box.innerHTML="";
    p.daily.forEach((u,i)=>{
      const el=document.createElement("div");
      el.className="unit "+(pp?["","push","pull"][st[i]]:(st[i]?"on":""));
      el.tabIndex=0; el.setAttribute("role","button");
      el.innerHTML=(pp?'<span class="tile">'+(["–","押","引"][st[i]])+'</span>':'<span class="led" style="color:'+(p.accent||"#fff")+';'+(st[i]?'background:'+p.accent:'')+'"></span>')+
        '<span class="txt">'+esc(u[0])+'<small>'+esc(u[1])+'</small></span>';
      const t=()=>{ st[i]=pp?(st[i]+1)%3:(st[i]?0:1); draw(); store.set(KEY,JSON.stringify(st)); };
      el.addEventListener("click",t);
      el.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();t();} });
      box.appendChild(el);
    });
    num.innerHTML = pp ? '<span style="color:#F0C24B">'+st.filter(v=>v===1).length+'</span><small> ／ </small><span style="color:#5FA8D3">'+st.filter(v=>v===2).length+'</span>'
      : Math.round(st.filter(Boolean).length/st.length*100)+'<small>%</small>';
  }
  $("#rs").addEventListener("click",()=>{ st=st.map(()=>0); draw(); store.set(KEY,JSON.stringify(st)); });
  draw();
}

render();
